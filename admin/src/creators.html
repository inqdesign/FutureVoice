const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c != null && c !== false) n.append(c);
  return n;
};

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2200);
}

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return `${Math.round(s / 86400)}일 전`;
}

function days() {
  const out = [];
  for (let i = DATA.days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    out.push(d.toISOString().slice(0, 10));
  }
  return out;
}

async function load() {
  const r = await fetch(`${BASE}/creators/data.json`, {cache:"no-store", credentials:"same-origin"});

  renderNotes();
  renderCohort();
}

async function act(id, action, body = {}) {
  const r = await fetch(`${BASE}/creators/${id}/${action}`, {
    method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body),
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) {
    toast(out.error === "already_redeemed" ? "이미 쓴 코드는 다시 만들 수 없어요." : out.error === "tables_missing" ? "마이그레이션이 아직 안 들어갔어요." : "저장하지 못했어요.");
    throw new Error(out.error);
  }
  return out;
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label} 복사했어요`);

`${a.name}님, 안녕하세요. 나와나를 만드는 이응규입니다.

100일 챌린지 1기 신청 잘 받았습니다. 아직 결제가 남아 있어서 연락드립니다.

챌린지는 미리 결제하고, 시작하는 날부터 같이 시작합니다. 아래 주소에서 결제해 주세요. 한 번만 결제되고, 자동으로 다시 결제되지 않습니다. 앱에서 쓰는 계정(Apple 또는 Google)으로 로그인하면 그 계정에 바로 적용됩니다.
https://nawana.app/pay?id=${a.id}&cur=${curOf(a.country)}

이미 앱에서 구독하고 계시다면 결제하지 마시고 이 메일에 답장해 주세요.

궁금한 점도 이 메일에 답장해 주세요.

크리에이터 프로그램 1기에 지원해 주셔서 고맙습니다. 적어주신 내용은 전부 읽었습니다.

// A challenger's three months, judged from the cohort's first day: a month is
// kept when at most one of its 30 days is missed. A day is the participant's
// own LOCAL date, as their phone reported it (challenge_days): 4 minutes of
// talk and one speech take. The dates are plain calendar dates counted from the
// cohort's first Seoul day; no time zone is applied to them here, because the
// phone already said which date it was. A date the phone never reported (an app
// from before the check-in) falls back to the server's talk ledger and is
// counted apart as talk-only, since nobody can see that day's speech.
const DAY_BAR = 240;
const seoulDate = (t) => new Date(new Date(t).getTime() + 9 * 3600000).toISOString().slice(0, 10);
const addDays = (date, n) => new Date(Date.parse(date + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10);
function months(a) {
  if (!DATA.cohort_start) return null;
  const first = seoulDate(DATA.cohort_start), today = seoulDate(DATA.now || Date.now());
  const days = a.days || {}, talk = a.talk || {};
  return [0, 1, 2].map((m) => {
    let met = 0, passed = 0, talkOnly = 0;
    for (let d = m * 30; d < m * 30 + 30; d++) {
      const date = addDays(first, d);
      // A day is judged once it is over in Seoul.
      if (date >= today) break;
      passed++;
      const row = days[date];
      if (row) {
        if (row.talk >= DAY_BAR && row.speech >= 1) met++;
      } else if ((talk[addDays(date, -1)] || 0) >= DAY_BAR || (talk[date] || 0) >= DAY_BAR) {
        // The ledger is kept by UTC day, so either side of Seoul's midnight counts.
        met++; talkOnly++;
      }
    }
    const missed = passed - met;
    return { n: m + 1, met, passed, talkOnly, over: passed === 30, kept: passed === 30 && missed <= 1, lost: missed > 1 };
  });
}

function renderCohort() {
  const box = document.getElementById("cohort");
  const input = el("input", {type:"date", class:"act", "aria-label":"1기 시작일"});
  // Shown as the Seoul day it was set to.
  if (DATA.cohort_start) input.value = new Date(new Date(DATA.cohort_start).getTime() + 9 * 3600000).toISOString().slice(0, 10);
  box.replaceChildren(
    el("span", {class:"legend", style:"margin:0", text:DATA.cohort_start ? "1기 시작일" : "1기 시작일이 아직 없어요"}),
    input,
    el("button", {type:"button", class:"act", text:"시작일 저장", onclick:async () => {
      if (!input.value) return;
      if (!confirm(`${input.value}을 1기 시작일로 저장할까요? 이미 결제한 챌린저의 100일도 이날부터로 맞춰져요.`)) return;
      const r = await fetch(`${BASE}/creators/cohort`, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify({day:input.value})});
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { toast("저장하지 못했어요."); return; }

// The form stores a country code; older applications hold a typed name, shown as written.
const REGION = (() => { try { return new Intl.DisplayNames(["ko"], {type:"region"}); } catch { return null; } })();
const countryName = (c) => { try { return (/^[A-Z]{2}$/.test(c || "") && REGION && REGION.of(c)) || c; } catch { return c; } };

// The fee's currency follows the country, as on the page: won in Korea, euro where the euro is money, dollars elsewhere.
const EUROZONE = new Set(["AT","BE","BG","CY","DE","EE","ES","FI","FR","GR","HR","IE","IT","LT","LU","LV","MT","NL","PT","SI","SK","AD","MC","SM","VA","ME","XK"]);
const LOCAL_CUR = { AE: "aed", AU: "aud", BR: "brl", CA: "cad", CH: "chf", CL: "clp", CN: "cny", CO: "cop", CZ: "czk", DK: "dkk", EG: "egp", GB: "gbp", HK: "hkd", HU: "huf", ID: "idr", IL: "ils", IN: "inr", KZ: "kzt", MX: "mxn", MY: "myr", NG: "ngn", NO: "nok", NZ: "nzd", PE: "pen", PH: "php", PK: "pkr", PL: "pln", QA: "qar", RO: "ron", SA: "sar", SE: "sek", SG: "sgd", TH: "thb", TR: "try", TW: "twd", TZ: "tzs", VN: "vnd", ZA: "zar" };
const curOf = (c) => !c || c === "KR" || c === "한국" ? "krw" : c === "JP" || c === "일본" ? "jpy" : EUROZONE.has(c) ? "eur" : LOCAL_CUR[c] || "usd";

function contactLink(a) {
  const c = String(a.contact).trim();
  if (/^https?:\/\//i.test(c)) return c;
  if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) return "mailto:" + c;
  const h = c.replace(/^@/, "");
  if (!/^[\w.]+$/.test(h)) return null;
  return (a.platforms || []).includes("instagram") && !(a.platforms || []).includes("threads")
    ? "https://www.instagram.com/" + h : "https://www.threads.com/@" + h;
}
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);

function strip(a) {
  const today = new Date().toISOString().slice(0, 10);
  const posted = new Set(a.posts);
  return el("div", {class:"strip"}, days().map((d) => {
    const mins = Math.round((a.talk[d] || 0) / 60);
    const on = posted.has(d);
    const cls = [on && "posted", mins > 0 && "talked", d === today && "today"].filter(Boolean).join(" ");
    return el("button", {
      type:"button", class:cls, title:`${d} · 통화 ${mins}분${on ? " · 올림" : ""}`,
      onclick: async (e) => {
        e.stopPropagation();
        await act(a.id, "post", {day:d, on:!on});
        if (on) a.posts = a.posts.filter((x) => x !== d); else a.posts.push(d);
        render();
      },
    }, [el("span", {text:String(+d.slice(8))}), mins > 0 ? el("span", {text:`${mins}분`}) : null]);
  }));
}

    onkeydown:(e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(); } }}, [
    el("div", {class:"l1"}, [
      el("b", {text:a.name}), el("span", {class:"h", text:a.contact}),

      `${m.n}번째 달 ${m.met}/${m.passed || 0}일 · ` + (m.kept ? "지킴" : m.lost ? "못 지킴" : m.passed ? "진행 중" : "시작 전")
      + (m.talkOnly ? ` · 통화만 확인 ${m.talkOnly}일` : "")}))));
    out.push(el("p", {class:"legend", text:"한 달에 하루까지 쉴 수 있어요. 하루는 참가자가 사는 곳의 날짜로, 앱이 보낸 통화 시간과 스피치 개수로 세요. 마지막 10일은 세지 않아요."}));
    if (ms.some((m) => m.talkOnly)) out.push(el("p", {class:"legend", text:"'통화만 확인'은 앱이 그날 기록을 보내지 않은 날이에요. 앱을 아직 업데이트하지 않은 경우예요. 통화 4분은 서버 기록으로 확인했고, 스피치는 확인하지 못했어요."}));
  }

  out.push(el("h3", {text:"보상 · 지킨 달마다 한 달 무료"}));
  if (a.rewarded_at) {
    out.push(el("p", {class:"text", text:`${String(a.rewarded_at).slice(0, 10)}에 ${a.reward_months}개월을 드렸어요.`}));
  } else {
    const pick = el("select", {class:"act", "aria-label":"무료로 줄 달 수"}, [0, 1, 2, 3].map((n) => el("option", {value:String(n), text:`${n}개월`})));
    pick.value = String(ms ? ms.filter((m) => m.kept).length : 0);
    out.push(el("div", {class:"bar"}, [pick, el("button", {type:"button", class:"act primary", text:"보상 확정", onclick:async () => {
      if (!confirm(`${a.name}님께 ${pick.value}개월 무료를 드릴까요? 한 번만 정할 수 있어요.`)) return;
      try { const res = await act(a.id, "reward", {months:Number(pick.value)}); Object.assign(a, res.app); await load(); toast("보상을 드렸어요"); }
      catch (e) { if (e.message === "no_package") toast("이 계정에 챌린지 이용권이 없어요. 직접 확인해 주세요."); }
    }})]));
    out.push(el("p", {class:"legend", text:"세 달이 끝난 뒤, 이용 기간이 끝나기 전(마지막 10일 안)에 정해주세요. 이용 기간이 그만큼 늘어나요."}));
  }
  return out;
}

function render() {
  const counts = {};
  for (const a of DATA.apps) counts[a.status] = (counts[a.status] || 0) + 1;
  document.getElementById("filters").replaceChildren(
    el("button", {type:"button", "aria-pressed":String(filter === null), text:`전체 ${DATA.apps.length}`, onclick:() => { filter = null; render(); }}),
    ...Object.keys(STATUS).map((s) => el("button", {type:"button", "aria-pressed":String(filter === s), text:`${STATUS[s]} ${counts[s] || 0}`, onclick:() => { filter = s; render(); }})),
  );
  const list = document.getElementById("list");
  if (DATA.error || DATA.missing) {
    list.replaceChildren(el("p", {class:"empty", text:DATA.missing ? "테이블이 아직 없어요. 마이그레이션 20261109190000_creator_program.sql을 적용하면 채워져요." : "읽지 못했어요: " + DATA.error}));
    return;
  }
  const rows = DATA.apps.filter((a) => filter === null || a.status === filter);
  const emails = [...new Set(rows.map((a) => a.email).filter(Boolean))];
  const mailBar = emails.length ? [el("div", {class:"bar", style:"margin:0 0 10px"}, [el("button", {type:"button", class:"act", text:`이 목록의 이메일 ${emails.length}개 복사`, onclick:() => copy(emails.join(", "), "이메일")})])] : [];
  list.replaceChildren(...mailBar, ...(rows.length
    ? rows.map((a) => (a.id === openId ? detail(a) : row(a)))
    : [el("p", {class:"empty", text:"아직 없어요."})]));
}

function renderNotes() {
  const box = document.getElementById("notes"), notes = DATA.notes || [];
  box.replaceChildren(...(notes.length ? notes.map((n) => el("div", {class:"note-row" + (n.hidden ? " gone" : "")}, [
    el("p", {class:"note-text", text:n.body}),
    el("small", {text:new Date(n.created_at).toLocaleString("ko-KR")}),
    el("button", {type:"button", class:"act", text:n.hidden ? "다시 보이기" : "숨기기", onclick:async () => {
      await act(n.id, n.hidden ? "note-show" : "note-hide"); n.hidden = !n.hidden; renderNotes();
    }}),
  ])) : [el("p", {class:"empty", text:"아직 없어요."})]));
}

load().catch(() => {
  document.getElementById("list").replaceChildren(el("p", {class:"empty", text:"읽지 못했어요. 새로고침해 주세요."}));
});
</script>
</body>
</html>
