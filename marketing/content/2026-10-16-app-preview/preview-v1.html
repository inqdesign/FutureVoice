<script>
/* ───────────── easing / time helpers ───────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: (x) => x,
  io: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  io5: (x) => (x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2),
  out: (x) => 1 - Math.pow(1 - x, 3),
  out5: (x) => 1 - Math.pow(1 - x, 5),
  in: (x) => x * x * x,
  back: (x) => { const c = 1.25; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const SHOT = (n) => `shots/${n}.png`;
const el = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); parent && parent.appendChild(e); return e; };
const px = (v) => `${v}px`;

/* camera: keyframes {t, fx, fy, z, px, py, e}; focus (fx,fy) in screen px lands on canvas (px,py) at zoom z.
   zoom interpolates in log space so a 4× push feels even. */
function camAt(t, kf) {
  if (t <= kf[0].t) return kf[0];
  for (let i = 0; i < kf.length - 1; i++) {
    const a = kf[i], b = kf[i + 1];
    if (t <= b.t) {
      const x = (E[b.e || "io"])(prog(t, a.t, b.t));
      return { fx: lerp(a.fx, b.fx, x), fy: lerp(a.fy, b.fy, x), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), x)),
        px: lerp(a.px, b.px, x), py: lerp(a.py, b.py, x) };
    }
  }
  return kf[kf.length - 1];
}
const camCSS = (c) => `translate(${c.px - c.fx * c.z}px,${c.py - c.fy * c.z}px) scale(${c.z})`;
const BASE = { fx: 603, fy: 1311, z: .465, px: 443, py: 1250 };

/* ───────────── world: grid + phone + headline ───────────── */
function makeWorld(name) {
  const w = { name };
  w.el = el("div", "world", stage);
  w.grid = el("div", "grid", w.el);
  w.back = el("div", "", w.el, { position: "absolute", inset: 0 });          // canvas-space, behind the phone
  w.flip = el("div", "flip", w.el);
  w.cam = el("div", "cam", w.flip);
  w.behind = el("div", "", w.cam, { position: "absolute", left: 0, top: 0 }); // screen-space, behind the phone
  w.phone = el("div", "phone", w.cam);
  el("div", "body", w.phone);
  [["l", 300, 90], ["l", 470, 190], ["l", 700, 190], ["r", 560, 290]].forEach(([s, top, h]) =>
    el("div", "btn", w.phone, { [s === "l" ? "left" : "right"]: "-7px", top: px(top), height: px(h) }));
  w.scr = el("div", "scr", w.phone);
  w.ov = el("div", "ov", w.scr);                                              // screen-space overlay, above screens
  w.band = el("div", "grid band", w.el);
  w.front = el("div", "", w.el, { position: "absolute", inset: 0 });         // canvas-space, above everything
  w.screens = {};
  return w;
}
function addScreen(w, shot) {
  const s = el("div", "screen", null); w.scr.insertBefore(s, w.ov);
  const img = el("img", "", s); img.src = SHOT(shot);
  w.screens[shot] = s; s.shot = shot; return s;
}
/* a piece of the capture that can move on its own; `cover` blanks the same rect in the base first */
function sprite(screen, [x0, y0, x1, y1], { pad = 6, radius = 0, cover = true, bg = "#fff" } = {}) {
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  const box = { left: px(x0), top: px(y0), width: px(x1 - x0), height: px(y1 - y0) };
  if (cover) el("div", "cover", screen, { ...box, background: bg });
  const s = el("div", "spr", screen, { ...box, borderRadius: px(radius),
    backgroundImage: `url(${SHOT(screen.shot)})`, backgroundPosition: `${-x0}px ${-y0}px` });
  s.cx = (x0 + x1) / 2; s.cy = (y0 + y1) / 2; return s;
}
function reveal(s, t, t0, { dur = .6, dy = 70, from = .94, origin = "center bottom" } = {}) {
  const x = E.out5(prog(t, t0, t0 + dur));
  s.style.opacity = clamp(prog(t, t0, t0 + dur * .45));
  s.style.transformOrigin = origin;
  s.style.transform = `translateY(${(1 - x) * dy}px) scale(${lerp(from, 1, x)})`;
}
/* lift: the piece comes off the screen toward the viewer */
function lift(s, amount, { scale = 1.06, dx = 0, dy = -10 } = {}) {
  const a = clamp(amount);
  s.style.transform = `translate(${dx * a}px,${dy * a}px) scale(${lerp(1, scale, a)})`;
  s.style.boxShadow = a > 0 ? `0 ${40 * a}px ${110 * a}px rgba(10,30,70,${.22 * a}),0 ${8 * a}px ${22 * a}px rgba(10,30,70,${.12 * a})` : "none";
  s.style.zIndex = a > 0 ? 5 : "";
}
/* headline: words rise out of a mask, staggered; leave by rising again */
function headline(w, lines, sub) {
  const h = el("h1", "head", w.front);
  w.words = [];
  lines.forEach((ln) => {
    const l = el("span", "ln", h);
    ln.split(" ").forEach((word, i, arr) => {
      const blue = word.startsWith("*"); const txt = word.replace(/^\*/, "");
      const s = el("span", "w" + (blue ? " b" : ""), l); s.textContent = txt;
      w.words.push(s);
      if (i < arr.length - 1) l.appendChild(document.createTextNode(" "));
    });
  });
  if (sub) { w.sub = el("div", "sub", w.front); w.sub.innerHTML = sub; }
}
function headlineAt(w, t, tin, tout, subIn) {
  w.words.forEach((s, i) => {
    const a = E.out5(prog(t, tin + i * .075, tin + i * .075 + .7));
    const b = E.in(prog(t, tout + i * .04, tout + i * .04 + .38));
    s.style.transform = `translateY(${(1 - a) * 115 - b * 115}%)`;
  });
  if (w.sub) {
    const a = E.out5(prog(t, subIn, subIn + .7)), b = E.in(prog(t, tout, tout + .35));
    w.sub.style.opacity = a * (1 - b);
    w.sub.style.transform = `translateY(${(1 - a) * 30 - b * 30}px)`;
  }
}
const show = (w, t, a, b) => { w.el.style.display = t >= a && t < b ? "block" : "none"; return t >= a && t < b; };

/* svg overlays in screen px */
const SVGNS = "http://www.w3.org/2000/svg";
function svgPath(parent, d, { stroke = "#0A5CF5", width = 8, fill = "none" } = {}) {
  let svg = parent.querySelector("svg");
  if (!svg) { svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("width", 1206); svg.setAttribute("height", 2622);
    svg.style.cssText = "position:absolute;left:0;top:0;overflow:visible"; parent.appendChild(svg); }
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", d); p.setAttribute("fill", fill); p.setAttribute("stroke", stroke); p.setAttribute("stroke-width", width);
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  svg.appendChild(p); p.len = p.getTotalLength(); p.style.strokeDasharray = p.len; p.style.strokeDashoffset = p.len;
  return p;
}
const draw = (p, x) => { p.style.strokeDashoffset = p.len * (1 - clamp(x)); };
const rrect = (x0, y0, x1, y1, r) => `M${x0 + r},${y0} H${x1 - r} A${r},${r} 0 0 1 ${x1},${y0 + r} V${y1 - r} A${r},${r} 0 0 1 ${x1 - r},${y1} H${x0 + r} A${r},${r} 0 0 1 ${x0},${y1 - r} V${y0 + r} A${r},${r} 0 0 1 ${x0 + r},${y0} Z`;

/* expanding outlines from a rounded rect (voice going out) */
function ripples(parent, rect, r, n = 3) {
  const [x0, y0, x1, y1] = rect;
  return Array.from({ length: n }, () => el("div", "", parent, { position: "absolute", left: px(x0), top: px(y0),
    width: px(x1 - x0), height: px(y1 - y0), borderRadius: px(r), border: "7px solid #0A5CF5", boxSizing: "border-box", opacity: 0 }));
}
function ripplesAt(rs, t, a, b, { period = 1.5, grow = 140 } = {}) {
  rs.forEach((d, i) => {
    const local = t - a - i * period / rs.length;
    if (t < a || t > b + period || local < 0) { d.style.opacity = 0; return; }
    const ph = (local % period) / period, cycle = Math.floor(local / period);
    if (a + i * period / rs.length + cycle * period > b) { d.style.opacity = 0; return; }
    d.style.opacity = .55 * (1 - ph);
    d.style.transform = `scale(${1 + ph * grow / 500})`;
  });
}

/* ═════════════════ the scenes ═════════════════ */
const stage = document.getElementById("stage");
const ring = el("div", "", stage); ring.id = "ring";

/* 1 · the call (0 – 6.5) ─────────────────────────── */
const W1 = makeWorld("call");
const s1 = addScreen(W1, "call-coach");
const c1 = {
  you: sprite(s1, [396, 536, 1145, 770], { radius: 60 }),
  fut: sprite(s1, [60, 832, 1016, 1132], { radius: 60 }),
  lis: sprite(s1, [778, 1194, 1145, 1373], { radius: 60 }),
  try: sprite(s1, [191, 2053, 1010, 2159]),
};
const wave1 = el("div", "wave", W1.ov, { left: "818px", top: "776px", height: "124px" });
const bars1 = Array.from({ length: 9 }, () => el("b", "", wave1));
const pill1 = ripples(W1.ov, [369, 2191, 836, 2383], 96);
headline(W1, ["Talk with your", "*fluent *self."], "In <i>your own voice.</i>");
const K1 = [
  { t: 0, fx: 603, fy: 860, z: .64, px: 443, py: 1010 },
  { t: 2.7, fx: 603, fy: 1311, z: .465, px: 443, py: 1250, e: "io" },
  { t: 4.6, fx: 603, fy: 1311, z: .48, px: 443, py: 1250, e: "io" },
  { t: 6.1, fx: 602, fy: 2287, z: .62, px: 443, py: 1480, e: "io" },
];

/* 2 · the slip, caught (5.75 – 12.0) ─────────────── */
const W2 = makeWorld("caught");
const s2 = addScreen(W2, "transcript");
const c2 = {
  q: sprite(s2, [60, 513, 763, 747], { radius: 60 }),
  u: sprite(s2, [469, 833, 1145, 1067], { radius: 60 }),
  card: sprite(s2, [180, 1079, 1145, 1576], { radius: 54, pad: 2 }),
  r: sprite(s2, [60, 1650, 1025, 1950], { radius: 60 }),
  u2: sprite(s2, [390, 2036, 1145, 2270], { radius: 60 }),
};
const goMark = svgPath(W2.ov, "M748,990 C775,1000 812,999 840,988", { stroke: "#FF9500", width: 9 });
const goRing = svgPath(W2.ov, "M793,903 C845,903 862,925 862,950 C862,980 830,997 793,997 C752,997 724,978 724,950 C724,922 752,905 800,906",
  { stroke: "#FF9500", width: 8 });
const wentBox = svgPath(W2.ov, rrect(440, 1186, 588, 1259, 22), { stroke: "#0A5CF5", width: 8 });
const wentFill = el("div", "", W2.ov, { position: "absolute", left: "440px", top: "1186px", width: "148px", height: "73px",
  borderRadius: "22px", background: "rgba(10,92,245,.10)", opacity: 0 });
headline(W2, ["Every slip,", "*caught."]);
const K2 = [
  { t: 5.75, fx: 603, fy: 1180, z: .5, px: 443, py: 1200 },
  { t: 8.6, fx: 603, fy: 1180, z: .5, px: 443, py: 1200 },
  { t: 9.55, fx: 662, fy: 1300, z: .82, px: 443, py: 1220, e: "io" },
  { t: 10.85, fx: 640, fy: 1290, z: .86, px: 443, py: 1220, e: "lin" },
  { t: 11.8, fx: 514, fy: 1222, z: 3.3, px: 443, py: 1120, e: "io5" },
];

/* 3 · say it again (11.65 – 18.3) ────────────────── */
const W3 = makeWorld("again");
const s3a = addScreen(W3, "say-again-reading");
const s3b = addScreen(W3, "say-again-done");
const prompt3 = ripples(W3.ov, [60, 1941, 1145, 2478], 90);
const chip3 = sprite(s3b, [762, 1250, 925, 1322], { radius: 36, pad: 4, cover: false });
headline(W3, ["Say it again,", "the *right *way."]);
const WENT_Z = 3.3 * (114 / 156);
const K3 = [
  { t: 11.8, fx: 559, fy: 2126, z: WENT_Z, px: 443, py: 1120 },
  { t: 13.1, fx: 603, fy: 1480, z: .5, px: 443, py: 1250, e: "io5" },
  { t: 15.2, fx: 603, fy: 1420, z: .5, px: 443, py: 1250, e: "io" },
  { t: 16.25, fx: 770, fy: 1180, z: .86, px: 443, py: 1240, e: "io" },
  { t: 16.95, fx: 760, fy: 1190, z: .88, px: 443, py: 1240, e: "lin" },
  { t: 17.65, fx: 603, fy: 1311, z: .465, px: 443, py: 1250, e: "io" },
];

/* 4 · your review (17.95 – 23.4) ─────────────────── */
const W4 = makeWorld("review");
const s4 = addScreen(W4, "review-item-sentence");
const deck = [
  el("div", "deckcard", W4.behind, { background: "#8FB4FA" }),
  el("div", "deckcard", W4.behind, { background: "#4C86F7" }),
];
deck.forEach((d) => Object.assign(d.style, { left: "48px", top: "515px", width: "1110px", height: "1761px" }));
const shimmer = el("div", "", W4.ov, { position: "absolute", left: "48px", top: "515px", width: "1110px", height: "1761px",
  borderRadius: "84px", overflow: "hidden" });
const shine = el("div", "", shimmer, { position: "absolute", top: 0, bottom: 0, width: "420px",
  background: "linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent)" });
headline(W4, ["Every mistake", "comes *back."]);
const K4 = [
  { t: 17.95, fx: 603, fy: 1311, z: .465, px: 443, py: 1250 },
  { t: 22.3, fx: 603, fy: 1360, z: .5, px: 443, py: 1260, e: "io" },
  { t: 23.15, fx: 603, fy: 1395, z: 3.4, px: 443, py: 960, e: "in" },
];

/* 5 · your level (22.95 – 27.2) ──────────────────── */
const W5 = makeWorld("level");
const s5 = addScreen(W5, "progress");
const b2 = sprite(s5, [114, 716, 308, 838], { pad: 10, radius: 20, cover: false });
const b2line = svgPath(W5.ov, "M112,868 H312", { stroke: "#0A5CF5", width: 10 });
headline(W5, ["Your level,", "*measured."]);
const K5 = [
  { t: 23.1, fx: 211, fy: 777, z: 7, px: 443, py: 960 },
  { t: 24.35, fx: 603, fy: 1080, z: .52, px: 443, py: 1180, e: "io5" },
  { t: 26.2, fx: 603, fy: 1120, z: .53, px: 443, py: 1200, e: "lin" },
];

/* end card (26.4 – 29.5) ──────────────────────────── */
const END = el("div", "", stage); END.id = "end";
el("div", "grid", END, { position: "absolute", inset: 0 });
const icon = el("div", "icon", END); el("img", "", icon).src = SHOT("icon");
const wm = el("div", "wm", END);
const wmL = "nawana".split("").map((c) => { const s = el("span", "", wm); s.textContent = c; return s; });
const tag = el("div", "tag", END); tag.innerHTML = "Learn a language from<br>your <span class=b>fluent self.</span>";
const endWave = el("div", "wave", END, { left: "343px", top: "1250px", height: "96px", padding: "0 30px" });
const endBars = Array.from({ length: 9 }, () => el("b", "", endWave));

stage.appendChild(ring);
const blue = el("div", "", stage); blue.id = "blue";

/* bars that read as a voice: deterministic, smooth */
function barsAt(bars, t, on, maxH, minH = 14) {
  bars.forEach((b, i) => {
    const v = .5 + .5 * Math.sin(t * 9.1 + i * 1.7) * Math.sin(t * 5.3 + i * .9 + 1);
    const env = Math.sin(Math.PI * (i + .5) / bars.length);
    b.style.height = px(minH + on * (maxH - minH) * (.25 + .75 * Math.abs(v)) * (.45 + .55 * env));
  });
}

/* ═════════════════ render(t) ═════════════════ */
function render(t) {
  /* 1 */
  if (show(W1, t, 0, 6.6)) {
    W1.cam.style.transform = camCSS(camAt(t, K1));
    reveal(c1.you, t, .2, { origin: "right bottom" });
    reveal(c1.fut, t, .8, { origin: "left bottom" });
    reveal(c1.lis, t, 2.25, { origin: "right bottom" });
    reveal(c1.try, t, 2.7, { dy: 40 });
    if (t > 2.85) { const b = .5 + .5 * Math.sin((t - 2.85) * 4.2); c1.lis.style.opacity = lerp(.62, 1, b); }
    const wOn = E.out5(prog(t, .95, 1.35)) * (1 - E.in(prog(t, 2.05, 2.35)));
    wave1.style.opacity = wOn; wave1.style.transform = `scale(${lerp(.6, 1, E.back(prog(t, .95, 1.45)))})`;
    barsAt(bars1, t, wOn, 92);
    ripplesAt(pill1, t, 2.6, 5.3);
    headlineAt(W1, t, .3, 5.45, 1.25);
  }
  /* 1 → 2: a blue ring opens from the talk pill */
  const wp = prog(t, 5.75, 6.6);
