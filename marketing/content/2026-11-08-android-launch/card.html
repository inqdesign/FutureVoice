<style>
/* One 1080×1350 Threads card, five layouts (?v=e|f|g|h|i, ?lang=ko, ?still).
   Round 2 (founder rejected round 1, kept as card-round1.html): bold modern sans (Pretendard,
   OFL, the font the Android app ships), no standalone mosaic, the hero is the REAL Android
   app: the phones in assets/ are cropped (frame + screen, corners masked) from the Play
   listing screenshots, never redrawn. The iPhone in H is the kit's nw-phone + nw-home. */
@font-face{font-family:"Pretendard";src:url(assets/pretendard.ttf) format("truetype");font-weight:45 930}
:root{
  color-scheme:light;
  --card:#F7F8FA; --ink:#0D1117; --sub:#5A6170; --faint:#9AA1AD; --accent:#0A5CF5;
  --sans:"Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;overflow:hidden}
.card{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;overflow:hidden;
  background:var(--card);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
.card>*{position:absolute;margin:0}
[data-v=e] .v:not(.ve),[data-v=f] .v:not(.vf),[data-v=g] .v:not(.vg),[data-v=h] .v:not(.vh),[data-v=i] .v:not(.vi){display:none!important}

/* shared type */
.hl{font-weight:800;letter-spacing:-.045em;line-height:1.08;white-space:nowrap}

.body{font-weight:500;letter-spacing:-.02em;color:var(--sub)}

.wm i{display:block;width:20px;height:20px;border-radius:5px;background:var(--accent)}
.play{display:inline-flex;align-items:center;gap:14px;height:68px;padding:0 30px;border-radius:34px;background:var(--ink);color:#fff;
  font-weight:700;font-size:28px;letter-spacing:-.02em;white-space:nowrap}
.play b{display:block;width:0;height:0;border-left:15px solid currentColor;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:2px}
.meta{font-weight:600;font-size:27px;letter-spacing:-.02em;color:var(--sub);white-space:nowrap}
.url{font-weight:700;font-size:28px;letter-spacing:-.02em;color:var(--accent)}
.phone{display:block;width:100%;height:auto}
.ph{filter:drop-shadow(0 50px 70px rgba(13,40,100,.22)) drop-shadow(0 10px 20px rgba(13,17,23,.12))}

/* ── E · one phone rising from the bottom edge, headline above, light ground ── */

[data-v=h] .lock img{width:60px;height:60px;border-radius:13.4px;box-shadow:0 0 0 1px rgba(13,17,23,.10),0 4px 14px rgba(13,17,23,.08)}

/* ?px=1|2: only "안드로이드" in the pixel face (Galmuri14), sized in whole multiples of its 14 px grid
   so every pixel block is the same size, baseline-matched to the Pretendard around it */
[data-px] [data-v=h] .hl em,[data-v=h][data-px] .hl em{font-family:"Galmuri14";font-weight:400;letter-spacing:0;-webkit-text-stroke:var(--pxs,0) #0A5CF5;line-height:0;position:relative;top:var(--pxy,0)}
[data-v=h][data-px="1"] .hl em{font-size:84px;--pxs:4px;--pxy:6px}

[data-v=h][data-px="3"] .hl em{font-size:var(--pxf,71px);--pxs:var(--pxw,5px);--pxy:var(--pxo,5px)}
[data-v=h] .body{left:0;right:0;top:382px;text-align:center;font-size:30px;line-height:46px}

/* the Android device: Pixel-style, black glass, thin metal band, buttons on the right */
.adev{position:absolute;inset:0;border-radius:48.4px;background:#0B0B0C;
  box-shadow:inset 0 0 0 1.63px #6E7076,inset 0 0 0 2.52px #2A2B2E}

[data-v=h] .stores{left:0;right:0;top:1228px;display:flex;justify-content:center;align-items:center;gap:18px}

/* the sticker: the five target languages (LanguageCatalog / the Android wordlists: en es de ja ko),

[data-v=h] .langs{left:50%;top:489px;transform:translateX(-50%) rotate(-1.8deg);z-index:3;display:flex;align-items:center;gap:8px;
  padding:9px 10px 9px 22px;border-radius:999px;background:#fff;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(13,17,23,.05),0 14px 30px rgba(13,40,100,.18),0 3px 6px rgba(13,17,23,.08)}

[data-v=h] .langs span{display:flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 13px;border-radius:20px;background:#F2F3F6;
  font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
[data-v=h] .langs i{display:block;width:9px;height:9px;border-radius:50%;background:var(--c)}
/* sticker variants (?s=1..5; none = the pill across the phone tops). Each language carries the
   theme accent the app switches to for it (kit HERO_LANG). */
[data-v=h][data-s] .langs{display:none!important}
.stk{position:absolute;z-index:4;display:none}
[data-v=h][data-s="1"] .s1,[data-v=h][data-s="2"] .s2,[data-v=h][data-s="3"] .s3,[data-v=h][data-s="4"] .s4,[data-v=h][data-s="5"] .s5{display:block}
.tag{position:absolute;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 16px;border-radius:24px;background:#fff;white-space:nowrap;
  font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  box-shadow:0 0 0 1px rgba(13,17,23,.05),0 12px 26px rgba(13,40,100,.17),0 2px 5px rgba(13,17,23,.08)}
.tag i{display:block;width:11px;height:11px;border-radius:50%;background:var(--c)}
.tag.lab{background:var(--ink);color:#fff;font-size:18px;font-weight:700;height:44px;padding:0 18px}

/* s1: a compact card on the iPhone's left edge, the five as a list */
.s1{left:64px;top:752px;width:162px;padding:16px 16px 12px;border-radius:20px;background:#fff;transform:rotate(-6deg);
  box-shadow:0 0 0 1px rgba(13,17,23,.05),0 14px 30px rgba(13,40,100,.18),0 3px 6px rgba(13,17,23,.08)}
.s1 b{display:block;font-size:15px;font-weight:700;letter-spacing:-.03em;color:var(--sub);margin-bottom:6px}

/* s2: a round seal on the Android's right edge, the label running round the top */
.s2{left:838px;top:668px;width:184px;height:184px;border-radius:50%;background:#fff;transform:rotate(8deg);

.s2 svg{position:absolute;inset:0;width:100%;height:100%}

/* s3: a two-row pill across the gap, under the rings */
.s3{left:50%;top:972px;transform:translateX(-50%) rotate(-3deg);padding:12px 16px;border-radius:26px;background:#fff;
  box-shadow:0 0 0 1px rgba(13,17,23,.05),0 14px 30px rgba(13,40,100,.18),0 3px 6px rgba(13,17,23,.08)}
.s3 .r{display:flex;align-items:center;gap:8px;justify-content:center}

.s3 span{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 10px;border-radius:15px;background:#F2F3F6;font-size:17px;font-weight:700;letter-spacing:-.02em}
.s3 i{width:8px;height:8px}
/* s4: layered tags fanned off the Android's bottom-right corner */
.s4{left:866px;top:968px;width:220px;height:260px}


/* ── I · extreme close-up on the call's correction, ink ground, headline in a clean block ── */
[data-v=i] .card{background:#0D1117;color:#fff}
[data-v=i] .zoom{left:-139px;top:-238px;width:1149px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 790px,#000 846px);mask-image:linear-gradient(to bottom,transparent 0,transparent 790px,#000 846px)}

  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 790px,#000 846px);mask-image:linear-gradient(to bottom,transparent 0,transparent 790px,#000 846px)}
[data-v=i] .wm{left:72px;top:72px;color:#fff}

</style>

<script type="module">

/* strings: lifted verbatim from copy.md (the accent span only colours a word) */
const COPY = {
  ko: { title: "<em>안드로이드</em>에도<br>나와나가 왔어요", titleL: "<em>안드로이드</em>에도<br>나와나가 왔어요",
        body: "아이폰과 같은 앱 그대로,<br>내 목소리로 말하는 유창한 나와 통화해요.",
        url: "nawana.app", free: "첫 20분은 무료예요", learn: "배울 수 있는 언어" },
  en: { title: "Now on<br><em>Android</em>", titleL: "Now on<br><em>Android</em>",
        body: "The same app as on iPhone.<br>Talk with your fluent self, in your own voice.",
        url: "nawana.app", free: "Your first 20 minutes are free", learn: "Learn" },
};
const q = new URLSearchParams(location.search);
const lang = q.get("lang") === "en" ? "en" : "ko";
const v = ["e", "f", "g", "h", "i"].includes(q.get("v")) ? q.get("v") : "e";
const root = document.documentElement, $id = id => document.getElementById(id);
root.lang = lang; root.dataset.v = v;
if (q.get("s")) root.dataset.s = q.get("s");
if (q.get("px")) root.dataset.px = q.get("px");
for (const k of ["pxf", "pxw", "pxo"]) if (q.get(k)) root.style.setProperty(`--${k}`, q.get(k) + "px");
/* H title options (?t=1..3, ko): founder's rewrites; t2 also shortens the body to one line */
const TITLES = {
  "1": { title: "<em>안드로이드</em>에서도<br>나와나를 만나요" },
  "2": { title: "이제 <em>안드로이드</em>에서도<br>유창한 나와 통화해요", body: "아이폰과 같은 앱 그대로, 내 목소리로." },
  "3": { title: "나와나,<br><em>안드로이드</em>에도 나왔어요" },
};
if (lang === "ko" && TITLES[q.get("t")]) Object.assign(COPY.ko, TITLES[q.get("t")]);
for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = COPY[lang][el.dataset.t];
/* the kit reads the page language when its screens connect, so it loads after lang is set */
await import("/web/kit/nawana-ui.js");

const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1350, 1); document.getElementById("card").style.transform = s < 1 ? `scale(${s})` : "none"; };
addEventListener("resize", fit); fit();

await document.fonts.ready;

/* the five target languages, each in its own language, with its theme accent */
const LANGS = [["English", "#0A5CF5"], ["Español", "#0AA3C2"], ["Deutsch", "#F58F0D"], ["日本語", "#F23B52"], ["한국어", "#0DA36B"]];
const tag = (name, c, x, y, r, cls = "") => `<span class="tag ${cls}" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)${c ? `;--c:${c}` : ""}">${c ? "<i></i>" : ""}${name}</span>`;
if (v === "h") {
  const L = Object.fromEntries(LANGS);
  const row = ([n, c]) => `<p style="--c:${c}"><i></i>${n}</p>`;
  $id("s1").innerHTML = `<b>${COPY[lang].learn}</b>` + LANGS.map(row).join("");
  $id("s2").innerHTML = `<svg viewBox="0 0 184 184"><defs><path id="arc" d="M30 92 A62 62 0 0 1 154 92"/></defs>

    <div class="ls">${LANGS.map(row).join("")}</div>`;
  const chip = ([n, c]) => `<span style="--c:${c}"><i></i>${n}</span>`;
  $id("s3").innerHTML = `<div class="r"><b>${COPY[lang].learn}</b>${LANGS.slice(0, 2).map(chip).join("")}</div><div class="r">${LANGS.slice(2).map(chip).join("")}</div>`;

    tag(COPY[lang].learn, "", 10, 0, -7, "lab"),

  $id("s5").innerHTML = [

    tag("日本語", L["日本語"], 918, 860, -9),

}
/* H with a title option: one headline size for all three, the largest that fits the longest line in 936 px */
if (v === "h" && q.get("t")) {
  const ttl = document.querySelector("[data-v=h] .hl.vh") || [...document.querySelectorAll(".vh.hl")][0];
  await document.fonts.ready;
  const probe = ttl.cloneNode(); probe.style.cssText = "position:absolute;visibility:hidden;font-size:92px;white-space:nowrap;left:0;top:0";
  probe.className = "hl"; document.getElementById("card").append(probe);
  let widest = 0; for (const t of Object.values(TITLES)) for (const line of t.title.split("<br>")) { probe.innerHTML = line; widest = Math.max(widest, probe.scrollWidth); }
  probe.remove();
  ttl.style.fontSize = `${Math.min(92, Math.floor(92 * 936 / widest))}px`;
  root.dataset.fit = `${widest}`;
  /* ?loose=1|2 (t2 + px3): the founder found the line cramped. Real word gaps, looser tracking,
     a little air either side of the pixel word, a bit more leading; one size step down if a line
     outgrows the 936 px measure, the pixel word scaled with it so the matched heights hold. */
  const loose = { "1": { ls: "-0.02em", ws: "0.30em" }, "2": { ls: "0em", ws: "0.35em" } }[q.get("loose")];
  if (loose && q.get("t") === "2") {

    ttl.style.letterSpacing = loose.ls; ttl.style.lineHeight = "1.16";
    const em = ttl.querySelector("em"); em.style.letterSpacing = "0"; em.style.margin = "0 0.08em 0 0";
    let F = 92;
    const widest = () => Math.max(...[...ttl.querySelectorAll(".ln")].map(l => l.getBoundingClientRect().width));

if (v === "h") {
  /* the goal arc's shape: 2/3 of the circle from 12 o'clock, round caps (300 box, r 140, 20 wide) */
  /* ko: 2/3 (founder) = 6 min 40 s of the 10-min goal, which the ring prints as "06:40" (talkClock). en: the en Play screenshot prints 03:00 on its ring, so its arc is 3 of 10 min */
  const P = +(q.get("p") || (lang === "en" ? 0.30 : 400 / 600)), th = 2 * Math.PI * P, ex = (150 + 140 * Math.sin(th)).toFixed(2), ey = (150 - 140 * Math.cos(th)).toFixed(2);

  root.style.setProperty("--arc", arc);
  /* talkRing's gradient: 40% accent at the tail (one cap-width before 12) to full accent at fadeEnd */
  const cap = 360 * (10 / (2 * Math.PI * 130)), fadeEnd = P > .12 ? Math.min(60 / 360, P * .4) / P : 0;
  const solid = fadeEnd * (360 * P + cap);

  const FLAME = '<svg viewBox="0 0 24 24" style="width:15px;height:17px;color:#8E8E93"><path fill="currentColor" d="M12.4 1.8c.4 3.1 2.3 4.7 4 6.6 1.6 1.8 3 3.8 3 6.7 0 4.2-3.2 7.1-7.3 7.1S4.6 19.4 4.6 15.4c0-2.5 1.1-4.4 2.5-5.9.3-.3.8-.1.8.3.1 1.2.6 2.3 1.4 2.9-.2-4.5 1-8.3 3.1-10.9zM12.2 13c-1.6 1.6-2.7 3.1-2.7 4.9 0 1.6 1.2 2.8 2.7 2.8s2.7-1.2 2.7-2.8c0-1.8-1-3.3-2.7-4.9z"/></svg>';
  /* mirror the Android screenshot's own header and ring label (en capture: "1 day streak", E, 03:00) */
  if (lang === "en") { sr.querySelector(".av").textContent = "E"; sr.querySelector(".ring small").textContent = "03:00"; }
  /* ConversationHome.goalHeadline: once anything is talked the line under the label is the time
     talked (PracticeStats.talkClock, %02d:%02d); the Android asset's baked label was redrawn the same way */
  else sr.querySelector(".ring small").textContent = "06:40";
  /* the ring's page dots (ConversationHome: three 6 pt circles, 8 apart, primary / primary 20%,
     36 pt under the 280 frame's bottom → centre 173 pt below the ring centre at 201,437) */
  const dots = document.createElement("div");
  dots.setAttribute("style", "position:absolute;left:0;right:0;top:607px;height:6px;display:flex;justify-content:center;gap:8px;z-index:2");
  dots.innerHTML = [1, .2, .2].map(o => `<i style="display:block;width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,${o})"></i>`).join("");
  sr.querySelector(".sc").append(dots);

  const act = sr.querySelector(".act"); act.style.gap = "4px"; act.innerHTML = `${FLAME}<b>${lang === "en" ? "1 day streak" : "2일 연속"}</b>`;
