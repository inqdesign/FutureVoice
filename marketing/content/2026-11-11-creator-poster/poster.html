<script>
// The long cast shadow, the carousel's: the silhouette repeated along the 45° line, darkest against the phone, gone at `reach`.
(function () {
  const reach = 195, peak = .58, step = 3, n = Math.round(reach / step), parts = [];
  const A = (d) => peak * Math.pow(Math.max(0, 1 - d / reach), 1.7);
  for (let i = 1; i <= n; i++) { const d = i * step, a = (A(d) - A(d + step)) / (1 - A(d + step)); parts.push(`${d}px ${d}px ${Math.round(3 + d * .16)}px rgba(13,17,23,${a.toFixed(4)})`); }
  document.getElementById("cast").style.boxShadow = parts.join(",");
})();
// The phone's outline, drawn by hand in one pass: straight sides that wander a hair, and corners that are true arcs
// concentric with the screen's (screen radius + the gap between them), so the frame reads as a phone's.
(function () {
  const svg = document.getElementById("sketch"), ph = svg.parentElement, sc = ph.querySelector(".screen");
  const W = ph.offsetWidth, H = ph.offsetHeight, pad = sc.offsetLeft, rs = parseFloat(getComputedStyle(sc).borderTopLeftRadius);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const SW = 10, g = pad - SW / 2 - 3;          // the line's centre sits g outside the screen: 3px of paper, then the line
  const i = pad - g, r = rs + g;                // inset of the line's centre from the phone box, and its corner radius
  let seed = 11; const j = () => ((seed = (seed * 16807) % 2147483647) / 2147483647 - .5) * 2.4;
  const x0 = i, y0 = i, x1 = W - i, y1 = H - i;
  const side = (ax, ay, bx, by) => `Q${(ax + bx) / 2 + j()} ${(ay + by) / 2 + j()} ${bx} ${by}`;
  const d = `M${x0 + r} ${y0} ${side(x0 + r, y0, x1 - r, y0)} A${r} ${r} 0 0 1 ${x1} ${y0 + r} ${side(x1, y0 + r, x1, y1 - r)} A${r} ${r} 0 0 1 ${x1 - r} ${y1} ` +
            `${side(x1 - r, y1, x0 + r, y1)} A${r} ${r} 0 0 1 ${x0} ${y1 - r} ${side(x0, y1 - r, x0, y0 + r)} A${r} ${r} 0 0 1 ${x0 + r} ${y0}Z`;
  const o = i - SW / 2 - 2; // the side buttons sit just outside the line
  svg.innerHTML = `<path d="${d}" stroke-width="${SW}"/>` +
    `<path d="M${o} ${H * .2} v40M${o} ${H * .28} v64M${W - o} ${H * .25} v84" stroke-width="6"/>`;
})();
// "Creator": a different handwriting per letter, changing hands in a wave (the page's own).
const HANDS = [["Caveat", 700, 1.24, .014], ["Dancing Script", 700, 1.2, .012], ["Pacifico", 400, 1, 0], ["Permanent Marker", 400, .9, 0], ["Rock Salt", 400, .68, .006], ["Homemade Apple", 400, .84, .018], ["Kaushan Script", 400, 1.06, .006], ["Reenie Beanie", 400, 1.34, .02], ["Yellowtail", 400, 1.16, .008], ["Gloria Hallelujah", 400, .9, .03], ["Satisfy", 400, 1.14, .012]];
const INKS = ["#0A5CF5", "#F0442E", "#FF8A00", "#E9AE00", "#12B76A", "#FF3D8B", "#7A4DFF", "#00AFC2", "#D9368B", "#2E9E3F"];
const paint = (el, [family, weight, scale, ink], color) => { el.style.color = color; el.style.fontFamily = `"${family}",cursive`; el.style.fontWeight = weight; el.style.fontSize = scale + "em"; el.style.webkitTextStroke = ink ? `${ink}em currentColor` : ""; };
const v = document.getElementById("v");
Promise.all([
  ...HANDS.map(([f, w]) => document.fonts.load(`${w} 40px "${f}"`, "Creator").catch(() => {})),
  document.fonts.load('600 40px "Geist"').catch(() => {}), document.fonts.load('40px "Nanum Pen Script"', "우리").catch(() => {}),
  new Promise((r) => { if (v.readyState >= 3) r(); else { v.addEventListener("canplay", r, { once: true }); setTimeout(r, 4000); } }),
]).then(() => {
  // "Creator" written with one marker: every letter is a stroke drawn here, in a capital and a small form, so the
  // word can mix the two (the marker face itself has no small letters). ?case=UllUllU sets the still's mix.
  const word = document.getElementById("creator-word");
  const GLYPH = [ // [capital, small], each [width, path] in a 100-high box, baseline at 90
    [[64, "M54 28C42 10 12 16 10 52C8 84 40 92 56 74"], [46, "M38 56C28 44 10 50 10 70C10 90 30 92 40 80"]],
    [[56, "M12 88L12 16C40 10 50 28 40 42C32 52 20 52 12 50M24 52L48 88"], [42, "M12 50L12 90M12 64C16 52 28 46 36 54"]],
    [[54, "M46 16L12 17L12 88L46 87M12 52L40 51"], [50, "M10 68L40 66C42 48 14 42 10 68C8 92 34 92 42 80"]],
    [[62, "M8 88L30 14L52 88M17 62L44 61"], [52, "M40 56C30 42 10 50 10 70C10 90 32 92 40 74M40 50L40 82C40 88 44 90 49 87"]],
    [[58, "M6 18L52 16M29 18L29 88"], [42, "M18 22L18 78C18 90 28 92 36 86M6 47L34 45"]],
    [[66, "M32 14C10 14 8 50 10 62C14 92 50 94 54 60C58 26 46 14 32 14Z"], [48, "M24 48C8 48 6 88 24 90C42 90 42 50 24 48Z"]],
    [[56, "M12 88L12 16C40 10 50 28 40 42C32 52 20 52 12 50M24 52L48 88"], [42, "M12 50L12 90M12 64C16 52 28 46 36 54"]],
  ];
  const TILT = [-4, 3, -2, 4, -3, 2, -4];
  const q = new URLSearchParams(location.search);
  const cs = (q.get("case") || "UllUllU").split("").map((c) => (c === "U" ? 0 : 1));
  const I0 = (q.get("inks") || "").split(",").map(Number); const ink0 = I0.length === 7 ? I0 : [0, 1, 2, 3, 4, 5, 6];
  word.className = "brush";
  word.innerHTML = GLYPH.map(() => "<svg><path/></svg>").join("");
  const cells = [...word.querySelectorAll("svg")], inked = ink0.slice();
  const draw1 = (k) => { const [w, d] = GLYPH[k][cs[k]], box = Math.max(GLYPH[k][0][0], GLYPH[k][1][0]); cells[k].setAttribute("viewBox", `0 0 ${box} 100`); cells[k].firstChild.setAttribute("d", d); cells[k].firstChild.setAttribute("transform", `translate(${(box - w) / 2} 0)`); cells[k].style.color = INKS[inked[k] % INKS.length]; cells[k].style.rotate = TILT[k] * (cs[k] ? .6 : 1) + "deg"; };
  cells.forEach((_, k) => draw1(k));
  const unusedInk = () => { const free = INKS.map((_, i) => i).filter((i) => !inked.includes(i)); return free[Math.floor(Math.random() * free.length)]; };
  // one letter at a time changes case and colour, a wave running through the word
  let k = 0;
  const tick = () => { cs[k] = 1 - cs[k]; inked[k] = unusedInk(); draw1(k); k = (k + 1) % cells.length; setTimeout(tick, k === 0 ? 900 : 130); };
  if (!q.has("still")) setTimeout(tick, 1500);
  // the mark blinks now and then
  const eyes = [[document.getElementById("e1"), 444], [document.getElementById("e2"), 440]];
  const blink = () => {
    const t0 = performance.now();
    const f = (now) => { const p = Math.min(1, (now - t0) / 220), b = Math.sin(p * Math.PI), h = 124 * (1 - .86 * b);
      for (const [e, y] of eyes) { e.setAttribute("height", h); e.setAttribute("y", y + (124 - h) / 2); e.setAttribute("rx", Math.min(39, h / 2)); }
      if (p < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  };
  if (!new URLSearchParams(location.search).has("still")) {
    [900, 2600, 2900, 4700, 6300, 8200, 8500, 10400, 11600].forEach((t) => setTimeout(blink, t));
    const look = (x) => eyes.forEach(([e]) => { e.style.translate = x + "px 0"; });
    [[1500, 46], [2300, 0], [3600, -40], [4300, 0], [5400, 46], [5900, -40], [6800, 0], [9200, 46], [10000, 0]].forEach(([t, x]) => setTimeout(() => look(x), t));
  }
  if (new URLSearchParams(location.search).has("crayon")) document.documentElement.classList.add("crayon");
  const still = new URLSearchParams(location.search).get("still");
  if (still != null) {
    document.documentElement.classList.add("still");
    // Played up to the frame and stopped there (the recorder's file server can't seek).
    const at = parseFloat(still) || 0;
    const ready = () => { document.documentElement.dataset.scene = "1"; };
    const watch = () => { if (v.currentTime >= at) { v.pause(); requestAnimationFrame(() => requestAnimationFrame(ready)); } else requestAnimationFrame(watch); };
    v.currentTime = 0; v.play().then(watch).catch(ready);
    return;
  }
  document.documentElement.dataset.scene = "1";
  setTimeout(() => { v.currentTime = 0; v.play().catch(() => {}); }, 1700);
});
