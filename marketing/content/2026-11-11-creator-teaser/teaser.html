<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>nawana creator program · teaser</title>
<!-- A 9:16 teaser for the creator program, built from the page's own drawing: the hero film, the marker frame,
     the boiling "Creator", the highlighter, the tear-off calendar. Recorded in real time:
       /opt/homebrew/opt/node@22/bin/node scripts/marketing/record.mjs \
         marketing/content/2026-11-11-creator-teaser/teaser.html --size 1080x1920 --seconds 21 \
         --wait-for "document.documentElement.dataset.scene" --out marketing/content/2026-11-11-creator-teaser/teaser.mp4
     ?t=<seconds> jumps the timeline there (for stills). -->
<style>
@font-face{font-family:"Caveat";font-weight:700;src:url(/web/creators/fonts/caveat.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:700;src:url(/web/creators/fonts/dancing-script.woff2) format("woff2")}
@font-face{font-family:"Pacifico";font-weight:400;src:url(/web/creators/fonts/pacifico.woff2) format("woff2")}
@font-face{font-family:"Permanent Marker";font-weight:400;src:url(/web/creators/fonts/permanent-marker.woff2) format("woff2")}
@font-face{font-family:"Rock Salt";font-weight:400;src:url(/web/creators/fonts/rock-salt.woff2) format("woff2")}
@font-face{font-family:"Homemade Apple";font-weight:400;src:url(/web/creators/fonts/homemade-apple.woff2) format("woff2")}
@font-face{font-family:"Kaushan Script";font-weight:400;src:url(/web/creators/fonts/kaushan-script.woff2) format("woff2")}
@font-face{font-family:"Reenie Beanie";font-weight:400;src:url(/web/creators/fonts/reenie-beanie.woff2) format("woff2")}
@font-face{font-family:"Yellowtail";font-weight:400;src:url(/web/creators/fonts/yellowtail.woff2) format("woff2")}
@font-face{font-family:"Gloria Hallelujah";font-weight:400;src:url(/web/creators/fonts/gloria-hallelujah.woff2) format("woff2")}
@font-face{font-family:"Satisfy";font-weight:400;src:url(/web/creators/fonts/satisfy.woff2) format("woff2")}
@font-face{font-family:"Nanum Pen Script";font-weight:400;src:url(/web/creators/fonts/nanum-pen-script.woff2) format("woff2")}

:root{--bg:#F7F8FA;--ink:#1C2133;--accent:#0A5CF5;--hi:rgba(255,226,60,.72);--paper:#FFFEFB;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;--pixel:"Geist Pixel","Galmuri11",var(--sans)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#121110;font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
.layer{position:absolute;inset:0}
@keyframes boil{0%{filter:url(#boil-1)}25%{filter:url(#boil-2)}50%{filter:url(#boil-3)}75%{filter:url(#boil-4)}}

/* 1 + 2: the opening film, as the page's hero */
#film video{width:100%;height:100%;object-fit:cover;display:block}
#film .shade{position:absolute;inset:0;background:linear-gradient(rgba(10,13,22,.62),rgba(10,13,22,.5) 45%,rgba(10,13,22,.66))}
#hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 90px}
#hero > *{opacity:0;translate:0 26px;transition:opacity .5s ease,translate .6s cubic-bezier(.2,.75,.3,1)}
#hero > .in{opacity:1;translate:0 0}
.gen{position:relative;z-index:0;display:inline-flex;align-items:center;gap:16px;font-size:40px;font-weight:700;line-height:1;padding:22px 40px}
.gen::after{content:"";position:absolute;inset:-4px -6px;z-index:-1;background:var(--accent);box-shadow:0 8px 40px rgba(10,92,245,.4);border-radius:22px 36px 20px 30px/30px 20px 36px 24px;rotate:-1.5deg;animation:boil .44s steps(1) infinite}
.gen i{width:26px;height:26px;border-radius:46% 54% 50% 50%/52% 48% 54% 46%;background:#fff}
.hot{margin-top:44px;font-family:var(--pen);font-size:118px;line-height:1.05;text-shadow:0 2px 30px rgba(0,0,0,.35)}
h1{margin-top:70px;font-family:var(--pixel);font-weight:400;font-size:168px;line-height:1.08;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.35)}
#creator-word{display:inline-block;white-space:nowrap;animation:boil .44s steps(1) infinite}
#creator-word i{display:inline-block;font-style:normal;text-align:center;line-height:0;letter-spacing:0;font-synthesis:none}
#creator-word b{font-weight:inherit}
.sub{margin-top:80px;font-size:50px;font-weight:600;line-height:1.45;text-shadow:0 2px 30px rgba(0,0,0,.35)}

/* 3: the promise, on the page's paper */
#paper{background:var(--bg);opacity:0;transition:opacity .45s ease}
#paper.in{opacity:1}
#paper::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(10,40,90,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(10,40,90,.045) 2px,transparent 2px);background-size:90px 90px}
#deal{display:flex;flex-direction:column;justify-content:center;padding:0 96px;color:var(--ink)}
#deal > *{opacity:0;translate:0 30px;transition:opacity .45s ease,translate .55s cubic-bezier(.2,.75,.3,1)}
#deal > .in{opacity:1;translate:0 0}
#deal .kick{font-family:var(--pen);font-size:108px;line-height:1.1;margin-bottom:56px}
#deal p{font-size:104px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
mark{color:inherit;background:linear-gradient(var(--hi),var(--hi)) 0 88%/0 56% no-repeat;padding:0 .1em;margin:0 -.1em;transition:background-size .8s cubic-bezier(.3,.7,.25,1);-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.on{background-size:100% 56%}
#deal.out > *{opacity:0;translate:0 -30px}

/* 4 + 5: the calendar and the close */
#pile-copy{text-align:center;color:var(--ink);padding-top:250px}
#pile-copy > *{opacity:0;translate:0 26px;transition:opacity .45s ease,translate .55s cubic-bezier(.2,.75,.3,1)}
#pile-copy > .in{opacity:1;translate:0 0}
#pile-copy .big{font-size:112px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
#end{position:absolute;left:0;right:0;top:250px;text-align:center;color:var(--ink)}
#end > *{opacity:0;translate:0 26px;transition:opacity .45s ease,translate .55s cubic-bezier(.2,.75,.3,1)}
#end > .in{opacity:1;translate:0 0}
#end .pen{font-family:var(--pen);font-size:104px;line-height:1.1}
#end .cta{display:inline-flex;align-items:center;height:132px;padding:0 70px;margin-top:44px;border-radius:999px;background:var(--ink);color:#fff;font-size:58px;font-weight:800}
#end .url{margin-top:44px;font-family:var(--pixel);font-size:64px}
canvas{position:absolute;inset:0;width:1080px;height:1920px}

/* the marker frame, over everything */
#frame{color:#fff;transition:color .3s ease;pointer-events:none}
#frame.black{color:#0B0B0D}
#frame::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 12px currentColor}
#frame svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil-1" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="boil-2" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="boil-3" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="boil-4" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73"/><feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<div class="layer" id="film"><video id="broll" src="/web/creators/broll/broll-900.mp4" muted loop playsinline preload="auto"></video><span class="shade"></span></div>
<div class="layer" id="hero">
  <p class="gen"><i></i>1기 모집</p>
  <p class="hot">우리의 가장 뜨거울 100일</p>
  <h1>nawana<br><span id="creator-word">Creator</span><br>program</h1>
  <p class="sub">100일 꾸준히 공부하고,<br>그 기록으로 크리에이터가 되세요!</p>
</div>

<div class="layer" id="paper">
  <div class="layer" id="deal">
    <span class="kick">나와나 크리에이터 1기 모집</span>
    <p>100일 동안 미친듯이</p>
    <p>공부하고,</p>
    <p>그 증거를 올려주세요.</p>
    <p><mark>나와나는 무료로</mark></p>
    <p><mark>드릴게요.</mark></p>
  </div>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="layer" id="pile-copy"><p class="big">하루 한 장씩, 100일.</p></div>
  <div id="end">
    <p class="pen">우리의 가장 뜨거울 100일</p>
    <span class="cta">1기 지원하기</span>
    <p class="url">nawana.app/creators</p>
  </div>
</div>

<div class="layer" id="frame"><svg id="frame-svg" viewBox="0 0 1080 1920" preserveAspectRatio="none"><path/><path/></svg></div>

<script src="/web/creators/vendor/matter-0.20.0.min.js"></script>
<script>
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const T0 = Number(new URLSearchParams(location.search).get("t") || 0); // jump the timeline (stills)

/* ---- the frame: the page's own hand, at this size ---- */
(() => {
  const [a, b] = $$("#frame-svg path"), W = 1080, H = 1920;
  const rnd = (seed) => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function hand(r, wob, seed) {
    const R = rnd(seed), x0 = 0, y0 = 0, x1 = W, y1 = H, pts = [];
    const side = (ax, ay, bx, by) => { const n = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / 200)); for (let i = 0; i < n; i++) pts.push([ax + (bx - ax) * i / n, ay + (by - ay) * i / n]); };
    side(x0 + r, y0, x1 - r, y0); pts.push([x1 - r * .3, y0 + r * .3]);
    side(x1, y0 + r, x1, y1 - r); pts.push([x1 - r * .3, y1 - r * .3]);
    side(x1 - r, y1, x0 + r, y1); pts.push([x0 + r * .3, y1 - r * .3]);
    side(x0, y1 - r, x0, y0 + r); pts.push([x0 + r * .3, y0 + r * .3]);
    const j = pts.map(([x, y]) => [x + (R() - .5) * wob * 2, y + (R() - .5) * wob * 2]);
    j.push([j[0][0], j[0][1] + wob], [j[1][0], j[1][1] + wob * 1.5], [j[1][0] + 100, j[1][1] + wob]);
    let d = `M${j[0][0].toFixed(1)} ${j[0][1].toFixed(1)}`;
    for (let i = 1; i < j.length - 1; i++) d += `Q${j[i][0].toFixed(1)} ${j[i][1].toFixed(1)} ${((j[i][0] + j[i + 1][0]) / 2).toFixed(1)} ${((j[i][1] + j[i + 1][1]) / 2).toFixed(1)}`;
    return d;
  }
  a.style.strokeWidth = 34; b.style.strokeWidth = 24;
  const frames = [11, 47, 83, 129].map((sd) => [hand(34, 6, sd), hand(34, 8.5, sd * 7 + 3)]);
  let k = 0; const show = () => { a.setAttribute("d", frames[k][0]); b.setAttribute("d", frames[k][1]); };
  show(); setInterval(() => { k = (k + 1) % frames.length; show(); }, 440);
})();

/* ---- "Creator", a different hand and ink per letter ---- */
const HANDS = [["Caveat", 700, 1.24, 0], ["Dancing Script", 700, 1.2, .012], ["Pacifico", 400, 1, 0], ["Permanent Marker", 400, .9, 0], ["Rock Salt", 400, .68, .006], ["Homemade Apple", 400, .84, .018], ["Kaushan Script", 400, 1.06, .006], ["Reenie Beanie", 400, 1.34, .02], ["Yellowtail", 400, 1.16, .008], ["Gloria Hallelujah", 400, .88, .014], ["Satisfy", 400, 1.14, .01]];
const INKS = ["#0A5CF5", "#F0442E", "#FF8A00", "#E9AE00", "#12B76A", "#FF3D8B", "#7A4DFF", "#00AFC2", "#D9368B", "#2E9E3F"];
const paint = (el, [family, weight, scale, ink], color) => { el.style.color = color; el.style.fontFamily = `"${family}",cursive`; el.style.fontWeight = weight; el.style.fontSize = scale + "em"; el.style.webkitTextStroke = ink ? `${ink}em currentColor` : ""; };
function startWord() {
  const word = $("#creator-word");
  const CELLS = [["C", .66], ["r", .43], ["e", .47], ["a", .52], ["t", .41], ["o", .5], ["r", .47]];
  word.innerHTML = CELLS.map(([l, w]) => `<i style="width:${w}em"><b>${l}</b></i>`).join("");
  const letters = [...word.querySelectorAll("b")];
  const wearing = letters.map((el, i) => { paint(el, HANDS[i], INKS[i]); return i; }), inked = letters.map((_, i) => i);
  const unused = (list, taken) => { const free = list.map((_, i) => i).filter((i) => !taken.includes(i)); return free[Math.floor(Math.random() * free.length)]; };
  let k = 0;
  const tick = () => { wearing[k] = unused(HANDS, wearing); inked[k] = unused(INKS, inked); paint(letters[k], HANDS[wearing[k]], INKS[inked[k]]); k = (k + 1) % letters.length; setTimeout(tick, k === 0 ? 620 : 95); };
  setTimeout(tick, 700);
}

/* ---- the calendar: the pad sheds Day 1 to 99 onto a pile; 100 stays ---- */
const cv = $("#cv"), ctx = cv.getContext("2d"), W = 1080, H = 1920;
const INK = "#1C2133", PAPER = "#FFFEFB", BLUE = "#0A5CF5";
const pad = { x: W / 2, y: 660, w: 250, h: 310 }, size = { w: 104, h: 129 };
let engine = null, pages = [], next = 1, padOn = false;
function sheet(x, y, a, w, h, n, lift) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.shadowColor = "rgba(28,33,51,.16)"; ctx.shadowBlur = lift; ctx.shadowOffsetY = lift / 3;
  ctx.fillStyle = PAPER; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, w * .06); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = BLUE; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h * .24, [w * .06, w * .06, 0, 0]); ctx.fill();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.font = `${Math.round(h * .13)}px "Geist Pixel", sans-serif`; ctx.fillText("DAY", 0, -h / 2 + h * .125);
  ctx.fillStyle = INK; ctx.font = `${Math.round(h * (n >= 100 ? .36 : .44))}px "Geist Pixel", sans-serif`; ctx.fillText(String(n), 0, h * .13);
  ctx.restore();
}
function binding() {
  const L = pad.x - pad.w / 2, T = pad.y - pad.h / 2, w = pad.w, bh = Math.round(w * .12);
  const by = T - bh - 3;
  const tw = w * .2, th = bh * .75;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(pad.x - tw / 2, by - th, tw, th + 4, [th / 2, th / 2, 0, 0]); ctx.fill();
  ctx.fillStyle = "#F7F8FA"; ctx.beginPath(); ctx.arc(pad.x, by - th * .32, th * .26, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.shadowColor = "rgba(28,33,51,.28)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(L - w * .04, by, w * 1.08, bh, [10, 10, 6, 6]); ctx.fill(); ctx.restore();
  for (const x of [L + w * .13, L + w * .87]) { ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(x, by + bh / 2, 5, 0, Math.PI * 2); ctx.fill(); }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (padOn) { sheet(pad.x, pad.y, 0, pad.w, pad.h, Math.min(next, 100), 26); binding(); }
  for (const p of pages) sheet(p.body.position.x, p.body.position.y, p.body.angle, size.w, size.h, p.n, 8);
}
function startPile() {
  const M = Matter; engine = M.Engine.create({ enableSleeping: true }); engine.gravity.y = 2.6;
  const wall = (x, y, w, h) => M.Bodies.rectangle(x, y, w, h, { isStatic: true });
  M.Composite.add(engine.world, [wall(W / 2, H - 20, W * 2, 80), wall(-10, H / 2, 60, H * 3), wall(W + 10, H / 2, 60, H * 3)]);
  padOn = true;
  let last = performance.now();
  (function loop(now) { M.Engine.update(engine, Math.min(32, now - last)); last = now; draw(); requestAnimationFrame(loop); })(last);
  // one page at a time, faster as it goes: Day 1 is watched, Day 99 is a blur
  const shed = () => {
    if (next > 99) return;
    const n = next++;
    const body = M.Bodies.rectangle(pad.x + (Math.random() - .5) * 60, pad.y + 40, size.w, size.h * .34, { chamfer: { radius: 4 }, friction: .3, frictionStatic: .4, frictionAir: .012, restitution: .02, density: .0012 });
    M.Body.setVelocity(body, { x: (Math.random() - .5) * 30, y: 2 + Math.random() * 6 });
    M.Body.setAngularVelocity(body, (Math.random() - .5) * .5);
    M.Composite.add(engine.world, body); pages.push({ body, n });
    if (n < 99) setTimeout(shed, Math.max(16, 300 * Math.pow(.9, n)));
  };
  setTimeout(shed, 500);
  // the close: Day 100 comes off too, and the pad goes with it
  window.dropLast = () => {
    padOn = false;
    const body = M.Bodies.rectangle(pad.x, pad.y, size.w, size.h * .34, { chamfer: { radius: 4 }, friction: .3, frictionAir: .025, restitution: .02, density: .0012 });
    M.Body.setAngularVelocity(body, .12);
    M.Composite.add(engine.world, body); pages.push({ body, n: 100 });
  };
}

/* ---- the timeline (seconds) ---- */
const at = (t, fn) => { const ms = (t - T0) * 1000; if (ms <= 0) fn(); else setTimeout(fn, ms); };
const show = (sel) => $(sel).classList.add("in"), hide = (sel) => $(sel).classList.remove("in");
function run() {
  startWord();
  const [gen, hot, h1, sub] = $("#hero").children;
  at(.3, () => gen.classList.add("in"));
  at(.9, () => hot.classList.add("in"));
  at(2.9, () => h1.classList.add("in"));
  at(4.6, () => sub.classList.add("in"));
  // 3: the promise
  at(7.6, () => { show("#paper"); $("#frame").classList.add("black"); });
  const lines = [...$("#deal").children];
  [8.0, 8.45, 8.85, 9.4, 10.5, 10.75].forEach((t, i) => at(t, () => lines[i].classList.add("in")));
  at(11.1, () => $$("#deal mark")[0].classList.add("on"));
  at(11.5, () => $$("#deal mark")[1].classList.add("on"));
  // 4: the calendar
  at(13.2, () => $("#deal").classList.add("out"));
  at(13.6, () => { startPile(); $("#pile-copy .big").classList.add("in"); });
  // 5: the close
  at(17.8, () => { $("#pile-copy .big").classList.remove("in"); window.dropLast && window.dropLast(); });
  [18.4, 18.75, 19.1].forEach((t, i) => at(t, () => $("#end").children[i].classList.add("in")));
}
const v = $("#broll");
Promise.all([
  document.fonts.ready.then(() => Promise.all([...HANDS.map(([f, w]) => document.fonts.load(`${w} 40px "${f}"`, "Creator")), document.fonts.load('40px "Geist Pixel"', "DAY 100 nawana"), document.fonts.load('40px "Nanum Pen Script"', "우리의 가장 뜨거울 100일 나와나 크리에이터 1기 모집")])),
  new Promise((ok) => { if (v.readyState >= 3) ok(); else { v.addEventListener("canplay", ok, { once: true }); setTimeout(ok, 4000); } }),
]).then(() => { v.currentTime = 0; v.play().catch(() => {}); document.documentElement.dataset.scene = "1"; run(); });
</script>
