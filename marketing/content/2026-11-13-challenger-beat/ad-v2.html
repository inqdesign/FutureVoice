  for (let b = 7; b <= 35; b += 4) blink = Math.max(blink, blinkAt(t, B(b)));
  let dx = 0;
  if (t >= B(5)) { const k = Math.floor((t - B(5)) / BEAT), p = eo3(seg(t, B(5 + k), B(5 + k) + .16)); dx = LOOK[(k + 3) % 4] + (LOOK[k % 4] - LOOK[(k + 3) % 4]) * p; }
  setEye(e1, EA[0], EB[0], m, blink, dx); setEye(e2, EA[1], EB[1], Math.min(1, m * 1.08), blink, dx);
  tail.style.translate = (-60 * m) + "px 0";
  // centre of the sheet → the poster's top mark (98 px for the 770-unit mark, centred, 64 px down)
  const f = eio(seg(t, B(4) - .05, B(4) + .45));
  const W0 = 330, W1 = 98 * 830 / 770, L0 = 540 - W0 / 2 + 12, Tp0 = 675 - W0 * 660 / 830 / 2, L1 = 491, Tp1 = 64;
  const w = W0 + (W1 - W0) * f;
  fly.style.width = w + "px"; fly.style.left = (L0 + (L1 - L0) * f) + "px"; fly.style.top = (Tp0 + (Tp1 - Tp0) * f) + "px";
  // a small bounce on the downbeat when it lands, and on each bar after
  let pump = 0; for (const b of [4, 8, 12, 16, 20, 24, 28, 33]) if (t >= B(b) + (b === 4 ? .45 : 0)) { const s = b === 4 ? B(4) + .45 : B(b); pump = .1 * Math.pow(1 - seg(t, s, s + .25), 2); }
  fly.style.scale = 1 + pump;
}

/* ── the frame ── */
const FX = ["boil-m1", "boil-m2", "boil-m3"], FS = ["boil-s", "boil-s2", "boil-s3"], FK = ["marker", "marker2", "marker3"];
const GR = [[0, 0], [-38, 22], [24, -46], [-58, -18], [42, 36], [-14, 58]];
function rise(el, t, at, dist = 34, dur = .5) { const p = eo3(seg(t, at, at + dur)); el.style.opacity = p; el.style.translate = `0 ${dist * (1 - p)}px`; }
function render(t) {
  const n8 = Math.max(0, Math.floor((t - T0) / E)), n16 = Math.max(0, Math.floor((t - T0) / (E / 2)));
  // the hand-drawn lines redraw on every eighth; the grain moves on every sixteenth
  fly.style.filter = `url(#${FX[n8 % 3]})`; $("sketch").style.filter = `url(#${FS[n8 % 3]})`; word.style.filter = `url(#${FK[n8 % 3]})`;
  $("grain").style.translate = GR[n16 % 6].map((v) => v + "px").join(" ");
  // the sheet lifts off as the mark flies up
  $("sheet").style.opacity = 1 - seg(t, B(4), B(4) + .55);
  drawMark(t);
  // the title, one word per sixteenth from the downbeat of bar 2
  rise($("w1"), t, B(4)); rise(word, t, B(4) + E / 2); rise($("w3"), t, B(4) + E);
  drawWord(t);
  // the phone comes up with the bar, the film settling back from a little too close (the site's in-film)
  const pp = eo4(seg(t, B(4) + .1, B(4) + 1.2));
  for (const el of [$("phone"), $("cast")]) { el.style.opacity = pp; el.style.translate = `0 ${120 * (1 - pp)}px`; }
  $("feed").style.scale = 1.22 - .22 * eo4(seg(t, B(4) + .1, B(4) + 1.6));
  // the feed: scrolled one reel per beat, landing on it
  let pos = 0;
  REELS.forEach(([b], i) => { if (i) pos += eo3(seg(t, B(b) - SWIPE, B(b))); });
  track.style.translate = `0 ${-pos * 100}%`;
  // the pen line under the title, on beat 6
  rise($("lede"), t, B(6), 24);
  drawScenes(t, n8);
  // the address: up on beat 6, marked with the highlighter on the last bar
  rise($("url"), t, B(6), 24);
  $("hl").style.backgroundSize = (eo3(seg(t, B(16), B(16) + .35)) * 100) + "% 100%";
  // bar 6: the poster clears. The phone drops off the bottom, the title and the address lift away; the mark stays.
  const out = seg(t, B(20), B(20) + .45), outE = out * out * out;
  for (const el of [$("phone"), $("cast")]) if (t >= B(20)) el.style.translate = `0 ${1100 * outE}px`;
  if (t >= B(20)) { const f = eo3(seg(t, B(20), B(20) + .3)); for (const el of [$("w1"), word, $("w3"), $("url"), $("lede")]) { el.style.opacity = 1 - f; el.style.translate = `0 ${-30 * f}px`; } }
  drawOutro(t);
}

/* ── "Join us" in the same marker as "Creator": strokes in a 100-high box, baseline 90, capital and small ── */
const GJOIN = [
  [[50, "M16 16L46 16M34 16L34 68C34 88 14 92 8 76"], [34, "M24 50L24 94C24 106 12 108 6 99M24 32L24 34"]],
  GO,
  [[36, "M8 16L30 15M19 16L19 88M8 88L30 87"], [22, "M11 50L11 88M11 32L11 34"]],
  [[60, "M10 88L10 16L50 88L50 15"], [46, "M10 50L10 90M10 64C14 50 36 46 38 62L38 90"]],
  null,
  [[58, "M10 16L10 62C10 92 48 94 48 62L48 15"], [46, "M10 50L10 76C10 94 36 94 38 74M38 50L38 90"]],
  [[52, "M44 24C36 12 10 14 10 32C10 50 44 48 44 68C44 90 14 92 6 78"], [40, "M34 54C28 46 10 46 10 58C10 68 34 66 34 78C34 92 12 92 6 84"]],
];
const JCASE0 = [0, 1, 0, 1, 0, 0, 1], JINK0 = [7, 2, 5, 0, 0, 4, 1], JTILT = [-3, 3, -2, 4, 0, -4, 2];
const joinEl = $("joinus"); joinEl.className = "brush";
joinEl.innerHTML = GJOIN.map((g) => (g ? "<svg><path/></svg>" : '<i class="gap"></i>')).join("");
const jcells = [...joinEl.children];
const JOIN_AT = B(22), JFLIP = B(23), JBARS = [B(24), B(28), B(33)]; // up with the first page; whole word flips on the bars and on Day 100
function drawJoin(t) {
  const n8 = t >= JFLIP ? Math.floor((t - JFLIP) / E) + 1 : 0, letters = [0, 1, 2, 3, 5, 6];
  joinEl.style.filter = `url(#${["marker", "marker2", "marker3"][Math.max(0, Math.floor((t - T0) / E)) % 3]})`;
  $("o2").style.opacity = t >= JOIN_AT ? 1 : 0;
  jcells.forEach((c, k) => {
    if (!GJOIN[k]) return;
    let flips = 0, last = JOIN_AT + letters.indexOf(k) * E / 4;
    let big = false;
    for (let j = 0; j < n8; j++) if (letters[j % letters.length] === k) { flips++; last = JFLIP + j * E; big = false; }
    for (const b of JBARS) if (t >= b) { flips++; if (b >= last) { last = b; big = true; } }
    const cs = (JCASE0[k] + flips) % 2, [w, d] = GJOIN[k][cs], box = Math.max(GJOIN[k][0][0], GJOIN[k][1][0]);
    c.setAttribute("viewBox", `0 0 ${box} 100`);
    c.firstChild.setAttribute("d", d);
    c.firstChild.setAttribute("transform", `translate(${(box - w) / 2} 0)`);
    c.style.color = INKS[(JINK0[k] + flips * 3 + (flips ? k : 0)) % INKS.length];
    const born = JOIN_AT + letters.indexOf(k) * E / 4, inP = seg(t, born, born + .22);
    const first = flips === 0, p = seg(t, last, last + (big ? .3 : .2));
    const sc = t < born ? 0 : first ? (1.35 - .35 * eo3(inP)) * eo3(Math.min(1, inP * 3)) : 1 + (big ? .32 : .2) * Math.pow(1 - p, 2);
    c.style.transform = `rotate(${JTILT[k] * (cs ? .6 : 1)}deg) scale(${sc})`;
  });
}

/* ── the outro: the 100-day pad. Its line rises on beat 21, the pad hangs on 21½, Day 1 comes off on 22, the pages
   come off faster and faster (as on the site) and Day 99 is gone just before the downbeat of bar 8 (beat 28), where
   Day 100 is left on the pad and "같이 해요" lands. Matter.js, stepped at 60 Hz on this clock, seeded, so every take is the same. ── */
const TOTAL = 22.6; // the founder's longer track (copy_F74C69A9….MOV), 22.64 s
const PAD = { x: 540, y: 520, w: 170, h: 211 }, PG = { w: 80, h: 99 };
const INK = "#1C2133", PAPER = "#FFFEFB", BLUE = "#0A5CF5";
const pcv = $("pilecv"), pctx = pcv.getContext("2d");
const TEAR = (() => {               // Day n leaves the pad at TEAR[n-1]
  const t0 = B(22), t1 = B(33) - .45, floor = 1 / 45;
  const total = (qq) => { let s = 0; for (let k = 0; k < 98; k++) s += Math.max(floor, E * Math.pow(qq, k)); return s; };
  let lo = .3, hi = .99; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (total(m) > t1 - t0) hi = m; else lo = m; }
  const out = [t0]; for (let k = 0; k < 98; k++) out.push(out[k] + Math.max(floor, E * Math.pow(lo, k)));
  return out;
})();
let sim = null;
function seeded(n) { return () => ((n = (n * 16807) % 2147483647) / 2147483647); }
function newSim() {
  const M = window.Matter, rnd = seeded(7);
  const engine = M.Engine.create({ enableSleeping: true }), T = 200, W = 1080, H = 1350;
  M.Composite.add(engine.world, [
    M.Bodies.rectangle(W / 2, H + T / 2, W * 3, T, { isStatic: true, friction: .5 }),
    M.Bodies.rectangle(-T / 2, H / 2, T, H * 4, { isStatic: true }),
    M.Bodies.rectangle(W + T / 2, H / 2, T, H * 4, { isStatic: true }),
  ]);
  return { M, engine, rnd, pages: [], next: 1, clock: B(22) - 1 / 60 };
}
function tearOne(S) {
  const { M, rnd } = S;
  const b = M.Bodies.rectangle(PAD.x, PAD.y + PAD.h * .08, PG.w, PG.h * .34, { chamfer: { radius: 3 }, friction: .3, frictionStatic: .4, frictionAir: .06, restitution: .02, density: .0012 });
  const tx = PG.w + rnd() * (1080 - PG.w * 2), dir = tx < PAD.x ? -1 : 1;
  M.Body.setAngle(b, dir * .06);
  M.Body.setVelocity(b, { x: dir * (1 + rnd() * 1.5), y: 2.5 + rnd() * 1.5 });
  M.Body.setAngularVelocity(b, dir * (.035 + rnd() * .05));
  M.Composite.add(S.engine.world, b);
  S.pages.push({ body: b, n: S.next, tx, born: S.clock, sway: rnd() * 6.28, age: 0 });
  S.next++;
}
function stepTo(t) {
  if (!sim || t < sim.clock - 1e-6) sim = newSim();
  while (sim.clock + 1 / 60 <= t + 1e-6) {
    sim.clock += 1 / 60;
    while (sim.next <= 99 && TEAR[sim.next - 1] <= sim.clock) tearOne(sim);
    for (const p of sim.pages) {     // paper in the air: it leans toward its own spot and sways on the way down
      if (p.tx == null) continue;
      const b = p.body;
      if (b.isSleeping || b.position.y > 1350 - PG.h * 1.5 || (++p.age > 40 && b.speed < .4)) { p.tx = null; continue; }
      const lean = clamp((p.tx - b.position.x) / 140, -1, 1);
      sim.M.Body.applyForce(b, b.position, { x: b.mass * (.0024 * lean + .0003 * Math.sin(p.sway + p.age * .11)), y: 0 });
      sim.M.Body.setAngularVelocity(b, b.angularVelocity * .97 + .004 * Math.sin(p.sway + p.age * .11));
    }
    sim.M.Engine.update(sim.engine, 1000 / 60);
  }
}
function sheet(ctx, x, y, a, w, h, n, lift, sc = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(sc, sc);
  ctx.shadowColor = "rgba(28,33,51,.16)"; ctx.shadowBlur = lift; ctx.shadowOffsetY = lift / 3;
  ctx.fillStyle = PAPER; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, w * .06); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = BLUE; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h * .24, [w * .06, w * .06, 0, 0]); ctx.fill();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.font = `600 ${Math.round(h * .12)}px "Geist", sans-serif`;
  ctx.letterSpacing = `${(h * .02).toFixed(1)}px`; ctx.fillText("DAY", 0, -h / 2 + h * .125); ctx.letterSpacing = "0px";
  ctx.fillStyle = INK; ctx.font = `700 ${Math.round(h * (n >= 100 ? .36 : .44))}px "Geist", sans-serif`;
  ctx.fillText(String(n), 0, h * .13);
  ctx.restore();
}
function binding(ctx, next) {
  const L = PAD.x - PAD.w / 2, T = PAD.y - PAD.h / 2, w = PAD.w, bh = Math.round(w * .12);
  const stubs = Math.min(5, 1 + Math.floor((next - 1) / 20)), by = T - stubs - bh + 1;
  ctx.fillStyle = "#EFEBE2"; ctx.beginPath(); ctx.moveTo(L + 1, by + bh - 2); ctx.lineTo(L + w - 1, by + bh - 2);
  const teeth = Math.round(w / 5);
  for (let i = teeth; i >= 0; i--) ctx.lineTo(L + 1 + (w - 2) * i / teeth, T + (i % 2 ? 1.6 : (i * 7 % 3) * .5 - .4));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(28,33,51,.14)"; ctx.lineWidth = 1;
  for (let i = 1; i < stubs; i++) { ctx.beginPath(); ctx.moveTo(L + 2, T - i + .5); ctx.lineTo(L + w - 2, T - i + .5); ctx.stroke(); }
  const tw = w * .2, th = bh * .75;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(PAD.x - tw / 2, by - th, tw, th + 4, [th / 2, th / 2, 0, 0]); ctx.fill();
  ctx.fillStyle = "#F7F8FA"; ctx.beginPath(); ctx.arc(PAD.x, by - th * .32, Math.max(2, th * .26), 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.shadowColor = "rgba(28,33,51,.28)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(L - w * .04, by, w * 1.08, bh, [5, 5, 3, 3]); ctx.fill(); ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.beginPath(); ctx.roundRect(L - w * .04 + 3, by + 2, w * 1.08 - 6, 1.5, 1); ctx.fill();
  for (const x of [L + w * .13, L + w * .87]) {
    ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(x, by + bh / 2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, by + bh / 2, .9, 0, Math.PI * 2); ctx.fill();
  }
}
function drawOutro(t) {
  const ctx = pctx; ctx.clearRect(0, 0, 1080, 1350);
  rise($("o1"), t, B(21), 30);
  // the pad hangs in on beat 21½, a little pop
  const pin = seg(t, B(21.5), B(21.5) + .35);
  if (t < B(21.5)) { $("o2").style.opacity = 0; $("url2").style.opacity = 0; return; }
  if (t >= B(22) - 1 / 60) stepTo(t);
  const S = t >= B(22) - 1 / 60 ? sim : { pages: [], next: 1, clock: t };
  const grow = (p) => { const k = Math.min(1, (S.clock - p.born) / .42); return 1 + (PAD.w / PG.w - 1) * (1 - k) * (1 - k); };
  for (const p of S.pages) if (grow(p) === 1) sheet(ctx, p.body.position.x, p.body.position.y, p.body.angle, PG.w, PG.h, p.n, 6);
  const left = 100 - S.next;
  for (let i = Math.min(4, Math.ceil(left / 20)); i > 0; i--) {
    ctx.fillStyle = `rgba(28,33,51,${.05 + i * .02})`;
    ctx.beginPath(); ctx.roundRect(PAD.x - PAD.w / 2 + 2, PAD.y - PAD.h / 2 + i * 3, PAD.w - 4, PAD.h, PAD.w * .06); ctx.fill();
  }
  ctx.save(); ctx.globalAlpha = eo3(pin);
  const land = S.next >= 100 ? .16 * Math.pow(1 - seg(t, B(33), B(33) + .3), 2) * (t >= B(33) ? 1 : 0) : 0;
  const popIn = 1 - .25 * Math.pow(1 - pin, 3);
  sheet(ctx, PAD.x, PAD.y, 0, PAD.w, PAD.h, S.next, 18, popIn + land);
  for (const p of S.pages) if (grow(p) > 1) { const k = grow(p); sheet(ctx, p.body.position.x, p.body.position.y, p.body.angle, PG.w * k, PG.h * k, p.n, 10); }
  binding(ctx, S.next);
  ctx.restore();
  // Day 100: "Join us" lands with the track's return (beat 33), letter by letter on 32nds, in Creator's marker,
  // then trades case and colour like Creator does; the address after it
  drawJoin(t);
  rise($("url2"), t, B(33.5), 20);
}

/* ── run: ?manual for the frame-by-frame recorder, ?t=N for a still, nothing for real time ── */
const q = new URLSearchParams(location.search);
const manual = q.has("manual"), still = q.has("t") ? parseFloat(q.get("t")) : null;
document.documentElement.classList.add("manual");
function activeReels(t) {
  const out = [];
  REELS.forEach(([b, , from], i) => {
    const start = B(b) - SWIPE, next = i + 1 < REELS.length ? B(REELS[i + 1][0]) - SWIPE : 99;
    if (t < B(20) + .6 && t >= (i ? start : 0) && t < next + SWIPE) out.push([vids[i], from + Math.max(0, t - start)]);
  });
  return out;
}
async function seekAll(t) {
  await Promise.all(activeReels(t).map(([v, want]) => (Math.abs(v.currentTime - want) > .001
    ? new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.currentTime = want; setTimeout(r, 2000); })
    : null)));
}
window.renderAt = async (t) => { render(t); await seekAll(t); await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))); };
Promise.all([
  document.fonts.load('600 40px "Geist"').catch(() => {}), document.fonts.load('40px "Nanum Pen Script"', "우리의 가장 뜨거울 100일").catch(() => {}), document.fonts.load('40px "Guestbook Pen"', "쉬킨").catch(() => {}),
  ...vids.map((v) => new Promise((r) => { if (v.readyState >= 2) r(); else { v.addEventListener("loadeddata", r, { once: true }); setTimeout(r, 6000); } })),
]).then(async () => {
  if (manual) { render(0); document.documentElement.dataset.scene = "1"; return; }
  if (still != null) { await window.renderAt(still); document.documentElement.dataset.scene = "1"; return; }
  const t0 = performance.now();
  const loop = () => { const t = ((performance.now() - t0) / 1000) % TOTAL; render(t); activeReels(t).forEach(([v, want]) => { if (Math.abs(v.currentTime - want) > .25) v.currentTime = want; if (v.paused) v.play().catch(() => {}); }); requestAnimationFrame(loop); };
  document.documentElement.dataset.scene = "1"; loop();
});
</script>
