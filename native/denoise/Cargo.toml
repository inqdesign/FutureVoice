[package]
name = "fvdenoise"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "DeepFilterNet3 noise removal for the voice-clone recording, one call per take"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# DeepFilterNet (MIT/Apache-2.0), its tract runtime and the DFN3 model built in.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

# The Android app calls in through JNI (`com.roro.futurevoice.audio.VoiceDenoiser`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
