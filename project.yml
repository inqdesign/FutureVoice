name: FutureVoice
options:
  bundleIdPrefix: com.roro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # An Icon Composer icon is a folder on disk and ONE file to Xcode.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  developmentLanguage: en
  # Interface languages the app ships. NOT the device language: chrome resolves
  # in the learner's TARGET language and explanatory copy in their NATIVE one —
  # see UILanguage.swift. Adding a language = one entry here + its column in
  # Localizable.xcstrings.
  knownRegions: [en, ko, de, ja, zh-Hant, zh-Hans, es, fr, Base]

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Extract every SwiftUI string literal (Text/Label/Button/navigationTitle
    # all take LocalizedStringKey) into the string catalog at build time, so
    # the catalog can't silently drift from the code.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PXS8Q4NT67

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  FutureVoice:
    type: application
    platform: iOS
    sources:
      - path: FutureVoice
        excludes:
          - "Resources/Info.plist"
          - "Vendor/**"
      # The speech app's challenge cards, pictures, medals and challenge page
      # (2026-11-13, founder: one look in both apps). The speech-app-only
      # parts of these files sit behind SPEECH_APP.
      - path: SpeechApp/SpeechArena.swift
      - path: SpeechApp/SpeechArenaDetail.swift
      - path: SpeechApp/SpeechMedalCalendar.swift
      - path: SpeechApp/Illustrations
    dependencies:
      # DeepFilterNet noise removal for the clone recording, on the phone
      # (`VoiceDenoiser`). A Rust static library with the model built in;
      # rebuild with native/denoise/build-ios.sh.
      - framework: FutureVoice/Vendor/FVDenoise.xcframework
        embed: false
      - package: Supabase
        product: Supabase
      - package: PostHog
        product: PostHog
      # Widgets and the Live Activity are iPhone/iPad only; the Mac build
      # (Catalyst) ships without the extension.
      - target: FutureVoiceWidget
        platformFilter: iOS
    entitlements:
      path: FutureVoice/Resources/FutureVoice.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.roro.futurevoice
        # Opt-in sync of the learner's practice between their own devices
        # (`SyncEngine`). ONE container per config — see ICLOUD_CONTAINER
        # below — so a dev build can never sync into the shipped build's
        # cloud data, the same wall the separate bundle id puts around the
        # local stores.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - $(ICLOUD_CONTAINER)
        # Silent CloudKit pushes: the other device's talk lands on this one's
        # shelf without waiting for it to be opened (`SyncPush`). Nothing is
        # ever shown — `shouldSendContentAvailable` only — so this never asks
        # the learner for notification permission.
        #
        # The value is per config, but the SIGNING PROFILE has the last word:
        # measured 2026-09-25, a Release build signed with the team's
        # development profile came out `development` whatever this says, and
        # an App Store archive gets `production` from the distribution
        # profile the same way. So this documents intent and keeps an archive
        # from having to be rewritten — it is not the switch.
        aps-environment: $(APS_ENVIRONMENT)
        # Which CloudKit database: pinned per config, NOT left to the signing.
        # Unpinned, a Release build installed from Xcode (developer-signed)
        # synced into Development while the App Store build on the learner's
        # Mac synced into Production — same zone name, two databases, both
        # saying "synced" (2026-10-19 to 11-02, the founder's phone and Mac).
        com.apple.developer.icloud-container-environment: $(ICLOUD_ENVIRONMENT)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Mac gets an Icon Composer icon: macOS 26 puts a plain square
        # (the iPhone's 1024 PNG) inside a grey frame (2026-11-03).
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": AppIconMac
        PRODUCT_NAME: FutureVoice
        INFOPLIST_FILE: FutureVoice/Resources/Info.plist
        # 6 = Mac Catalyst with the MAC idiom ("Optimize Interface for Mac"):
        # native Mac metrics at 100%, not an iPad scaled down to 77%, which is
        # why the "Designed for iPad" build read as tiny on a Mac.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        # Same bundle id on the Mac: one App Store record, so a subscription,
        # Sign in with Apple and the iCloud sync container all carry over.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # The Mac needs the App Sandbox and its own key names (see the file).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FutureVoice/Resources/FutureVoice-mac.entitlements
        # The one ObjC file in the app: FVExceptionCatcher, which turns AVFAudio's
        # raised NSExceptions (uncatchable from Swift, twice a crash on
        # 2026-09-01) into NSErrors the realtime audio stack can retry on.
        SWIFT_OBJC_BRIDGING_HEADER: FutureVoice/Support/FutureVoice-Bridging-Header.h
        ENABLE_PREVIEWS: "YES"
      # Debug installs BESIDE the shipped app (its own bundle id → its own
      # data container), so a dev build can never migrate or overwrite the
      # TestFlight build's local stores. Release is untouched, so merging
      # this branch can't change what ships.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.dev
          APP_DISPLAY_NAME: nawana dev
          # Siri hears "nawana dev" as the store app "nawana"; a dev build
          # answers to a name the store app doesn't have.
          APP_SPOKEN_NAME: Future Voice
          ICLOUD_CONTAINER: iCloud.com.roro.futurevoice.dev
          APS_ENVIRONMENT: development
          ICLOUD_ENVIRONMENT: Development
          # iOS-type OAuth client in Android's GCP project (nawana-507414):
          # appDataFolder belongs to the project, so this is what lets a Mac
          # see the Android phone's synced practice (`GoogleDriveAuth`).
          GOOGLE_DRIVE_CLIENT_ID: 489651582849-hfvssub4hha9ua2jhm9bq6ubk6bcjpc8.apps.googleusercontent.com
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice
          APP_DISPLAY_NAME: nawana
          APP_SPOKEN_NAME: 나와나
          ICLOUD_CONTAINER: iCloud.com.roro.futurevoice
          APS_ENVIRONMENT: production
          ICLOUD_ENVIRONMENT: Production
          GOOGLE_DRIVE_CLIENT_ID: 489651582849-bvencr0e0871aefub0bikj33a3ha0l1i.apps.googleusercontent.com
    configFiles:
      Debug: Config/FutureVoice.xcconfig
      Release: Config/FutureVoice.xcconfig

  # The speech app: nawana's Speech tab as an app of its own (2026-11-07).
  # It builds the SAME sources with SPEECH_APP set, plus SpeechApp/ (its
  # @main, sign-in, languages, settings), so a fix to the speech code lands
  # in both apps. Same Supabase project and account as nawana. No widget,
  # no iCloud, no App Group, no daily call: none of that is in this app.
  SpeechApp:
    type: application
    platform: iOS
    sources:
      - path: FutureVoice
        excludes:
          - "Resources/Info.plist"
          - "Resources/InfoPlist.xcstrings"
          - "Resources/AppShortcuts.xcstrings"
          - "Resources/AppIconMac.icon"
          - "Resources/*.entitlements"
          - "Vendor/**"
      - path: SpeechApp
        excludes:
          - "Info.plist"
          - "SpeechApp.entitlements"
    dependencies:
      - framework: FutureVoice/Vendor/FVDenoise.xcframework
        embed: false
      - package: Supabase
        product: Supabase
      - package: PostHog
        product: PostHog
    entitlements:
      path: SpeechApp/SpeechApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: SpeechApp
        INFOPLIST_FILE: SpeechApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPEECH_APP"
        SWIFT_OBJC_BRIDGING_HEADER: FutureVoice/Support/FutureVoice-Bridging-Header.h
        ENABLE_PREVIEWS: "YES"
      # The name is a working one (founder, 2026-11-09: undecided). The bundle
      # ids stay neutral until it is settled: an id is permanent once
      # registered in App Store Connect.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.speech.dev
          APP_DISPLAY_NAME: nawana speech dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.speech
          APP_DISPLAY_NAME: nawana speech
    configFiles:
      Debug: Config/FutureVoice.xcconfig
      Release: Config/FutureVoice.xcconfig

  FutureVoiceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FutureVoiceWidget
        excludes:
          - "Info.plist"
      # Shared data contract with the app — keep this list to files with no
      # dependencies on Models.swift or the stores.
      - path: FutureVoice/Shared/StudyWidgetShared.swift
      - path: FutureVoice/Shared/RoutineWidgetShared.swift
      # Static CPU port of the Futureself shader — the widget can't run Metal.
      - path: FutureVoice/Shared/FutureselfPixels.swift
      # The situation playing now, for the Live Activity (Dynamic Island).
      - path: FutureVoice/Shared/SceneListeningActivity.swift
      # Pixel title font, shared with the app (registered in the widget's
      # Info.plist UIAppFonts).
      - path: FutureVoice/Resources/Fonts/GeistPixel-Square.ttf
    entitlements:
      path: FutureVoiceWidget/FutureVoiceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.roro.futurevoice
    settings:
      base:
        PRODUCT_NAME: FutureVoiceWidget
        INFOPLIST_FILE: FutureVoiceWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      # Must stay nested under the host app's id in BOTH configs.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.dev.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.widget

  FutureVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FutureVoiceTests
    dependencies:
      - target: FutureVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.tests
        GENERATE_INFOPLIST_FILE: YES

  # Gesture-level tests driven through the DebugCapture harness — things unit
  # tests can't see (drag-to-bin, sheet interactions).
  FutureVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FutureVoiceUITests
    dependencies:
      - target: FutureVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FutureVoice:
    build:
      targets:
        FutureVoice: all
    # NO storeKitConfiguration here on purpose (see the Store scheme below).
    # Debug builds run as
    # com.roro.futurevoice.dev, an id App Store Connect has no record of, so
    # Apple returns no products and the paywall's price lines are blank — a
    # property of the dev bundle id, not something to chase in ASC. The fix is
    # never a price list in this repo (that copy was deliberately deleted on
    # 2026-08-18 — see StoreKitService): run the RELEASE configuration on a
    # device to see Apple's own prices, or add a StoreKit configuration file
    # SYNCED from App Store Connect and point this key at it.
    test:
      targets:
        - FutureVoiceTests
        - FutureVoiceUITests

  SpeechApp:
    build:
      targets:
        SpeechApp: all

  # The same app, run in the RELEASE configuration — the only way a build
  # launched from Xcode carries the SHIPPING bundle id (com.roro.futurevoice)
  # and can therefore be priced by App Store Connect at all. Use it to check
  # the paywall's real prices and the purchase flow.
  #
  # Its own scheme, rather than flipping the main one: everyday development
  # stays on Debug (its own bundle id, its own data container), and this build
  # deliberately OVERWRITES the TestFlight install on the device, because it
  # has to share that id to be recognised.
  FutureVoice (Store):
    build:
      targets:
        FutureVoice: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - FutureVoiceTests
