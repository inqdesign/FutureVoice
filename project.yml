name: FutureVoice
options:
  bundleIdPrefix: com.roro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PXS8Q4NT67

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"

targets:
  FutureVoice:
    type: application
    platform: iOS
    sources:
      - path: FutureVoice
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: FutureVoice/Resources/FutureVoice.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: FutureVoice
        INFOPLIST_FILE: FutureVoice/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: "YES"
    configFiles:
      Debug: Config/FutureVoice.xcconfig
      Release: Config/FutureVoice.xcconfig

  FutureVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FutureVoiceTests
    dependencies:
      - target: FutureVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FutureVoice:
    build:
      targets:
        FutureVoice: all
    test:
      targets:
        - FutureVoiceTests
