name: FutureVoice
options:
  bundleIdPrefix: com.roro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PXS8Q4NT67

targets:
  FutureVoice:
    type: application
    platform: iOS
    sources:
      - path: FutureVoice
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice
        PRODUCT_NAME: FutureVoice
        INFOPLIST_FILE: FutureVoice/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: "YES"
    configFiles:
      Debug: Config/FutureVoice.xcconfig
      Release: Config/FutureVoice.xcconfig
