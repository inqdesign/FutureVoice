name: FutureVoice
options:
  bundleIdPrefix: com.roro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  # Interface languages the app ships. NOT the device language: chrome resolves
  # in the learner's TARGET language and explanatory copy in their NATIVE one —
  # see UILanguage.swift. Adding a language = one entry here + its column in
  # Localizable.xcstrings.
  knownRegions: [en, ko, de, Base]

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Extract every SwiftUI string literal (Text/Label/Button/navigationTitle
    # all take LocalizedStringKey) into the string catalog at build time, so
    # the catalog can't silently drift from the code.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PXS8Q4NT67

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  FutureVoice:
    type: application
    platform: iOS
    sources:
      - path: FutureVoice
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PostHog
        product: PostHog
      - target: FutureVoiceWidget
    entitlements:
      path: FutureVoice/Resources/FutureVoice.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.roro.futurevoice
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: FutureVoice
        INFOPLIST_FILE: FutureVoice/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: "YES"
      # Debug installs BESIDE the shipped app (its own bundle id → its own
      # data container), so a dev build can never migrate or overwrite the
      # TestFlight build's local stores. Release is untouched, so merging
      # this branch can't change what ships.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.dev
          APP_DISPLAY_NAME: nawana dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice
          APP_DISPLAY_NAME: nawana
    configFiles:
      Debug: Config/FutureVoice.xcconfig
      Release: Config/FutureVoice.xcconfig

  FutureVoiceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FutureVoiceWidget
        excludes:
          - "Info.plist"
      # Shared data contract with the app — keep this list to files with no
      # dependencies on Models.swift or the stores.
      - path: FutureVoice/Shared/StudyWidgetShared.swift
      # Pixel title font, shared with the app (registered in the widget's
      # Info.plist UIAppFonts).
      - path: FutureVoice/Resources/Fonts/GeistPixel-Square.ttf
    entitlements:
      path: FutureVoiceWidget/FutureVoiceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.roro.futurevoice
    settings:
      base:
        PRODUCT_NAME: FutureVoiceWidget
        INFOPLIST_FILE: FutureVoiceWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      # Must stay nested under the host app's id in BOTH configs.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.dev.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.widget

  FutureVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FutureVoiceTests
    dependencies:
      - target: FutureVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.tests
        GENERATE_INFOPLIST_FILE: YES

  # Gesture-level tests driven through the DebugCapture harness — things unit
  # tests can't see (drag-to-bin, sheet interactions).
  FutureVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FutureVoiceUITests
    dependencies:
      - target: FutureVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roro.futurevoice.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FutureVoice:
    build:
      targets:
        FutureVoice: all
    test:
      targets:
        - FutureVoiceTests
        - FutureVoiceUITests
