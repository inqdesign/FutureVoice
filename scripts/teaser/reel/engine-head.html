:root{--page:#0E0E10;--bg:#F2F2F5;--ink:#141416;--grey:#8A8A93;--blue:#2F62F5;--bubble:#E9E9EE;--mine:#D6E4FF;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--page)}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;box-sizing:border-box;font:13px/1.4 "Geist Mono",ui-monospace,Menlo,monospace;color:#cfcfd4}
body.export{padding:0;gap:0;display:block}
#frame{height:min(calc(100dvh - 90px),calc((100vw - 32px)*16/9));aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 30px 80px #000a;cursor:pointer}
body.export #frame{width:1080px;height:1080px;height:1920px;border-radius:0;box-shadow:none}
#stage{width:1080px;height:1920px;position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);overflow:hidden;font-family:"Geist",-apple-system,"Helvetica Neue",sans-serif;color:var(--ink)}
.glow{position:absolute;border-radius:50%;filter:blur(160px);pointer-events:none;opacity:.8}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.scene{position:absolute;inset:0;visibility:hidden}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;white-space:nowrap;font-weight:500;letter-spacing:-.02em;line-height:1}
.w{display:inline-block;width:0;overflow:visible;position:relative}
.w>.in{display:inline-flex;align-items:center;padding:0 .12em}
.l{display:inline-block;opacity:0;will-change:transform,filter}
.px{font-family:"GP","Geist",sans-serif;font-weight:400;letter-spacing:0;color:var(--blue)}
.dim{color:var(--grey)}
.ic{display:inline-block;opacity:0}
.ic svg{display:block}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:26px;color:var(--grey)}
.bub{position:absolute;padding:30px 40px;border-radius:44px;font-size:48px;line-height:1.3;letter-spacing:-.01em;background:var(--bubble);color:var(--ink);opacity:0;white-space:nowrap}
.bub.mine{background:var(--mine)}
.who{position:absolute;font-size:28px;color:var(--grey);opacity:0}
.dots{display:flex;gap:12px;padding:6px 4px}
.dots i{width:18px;height:18px;border-radius:50%;background:#A9A9B2;display:block}
.card{position:absolute;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(40,60,120,.14),0 2px 6px rgba(0,0,0,.05);padding:34px 40px;opacity:0}
.card .k{font-family:"Geist Mono",monospace;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
.card .v{font-size:46px;letter-spacing:-.01em;white-space:nowrap}
.hl{background:#DCE6FF;color:var(--blue);border-radius:10px;padding:0 8px;margin:0 -2px}
.chip{position:absolute;white-space:nowrap;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;box-shadow:0 8px 30px rgba(40,60,120,.12);padding:16px 34px;text-align:center;opacity:0;min-width:220px}
.chip b{display:block;font-weight:600;font-size:32px}
.chip span{display:grid;height:32px;font-size:26px;color:var(--grey)}
.chip span em{grid-area:1/1;font-style:normal}
#orb{position:absolute;opacity:0}
.check{position:absolute;width:76px;height:76px;border-radius:50%;background:#1FA85A;display:flex;align-items:center;justify-content:center;opacity:0;box-shadow:0 10px 30px rgba(31,168,90,.35)}
#end{position:absolute;inset:0;background:#0B0B0C;visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#fff}
#end .name{font-family:"GP",sans-serif;font-size:96px}
#end .url{font-family:"Geist Mono",monospace;font-size:30px;letter-spacing:.2em;color:#8a8a93}
.bar{display:flex;align-items:center;gap:12px;width:min(100%,560px)}
body.export .bar,body.export .note{display:none}
button{background:#1c1c1f;color:#eee;border:1px solid #333;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #4D8FFF;outline-offset:2px}
input[type=range]{flex:1;accent-color:#4D8FFF}
#time{font-variant-numeric:tabular-nums;min-width:92px;text-align:right;color:#8a8a93}
.note{color:#5d5d63;font-size:12px}
</style>

</div></div>
<div class="bar"><button id="play">Pause</button><button id="restart">Restart</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline"><span id="time">0:00</span></div>
<div class="note">9:16 · 1080×1920 · silent cut · space to play/pause</div>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const stage = $('#stage'), cam = $('#cam'), orbC = $('#orb'), octx = orbC.getContext('2d');
cam.appendChild(orbC);
const EXPORT = /export/.test(location.search) || location.hash === '#export';
if (EXPORT) document.body.classList.add('export');

// ——— pixel sprites ———
const SPR = {
  cross: ['XX....XX','XXX..XXX','.XXXXXX.','..XXXX..','..XXXX..','.XXXXXX.','XXX..XXX','XX....XX'],
  clock: ['..XXXX..','.X....X.','X...X..X','X...X..X','X...XX.X','X......X','.X....X.','..XXXX..'],
  phone: ['XX......','XXX.....','XX......','.XX.....','..XX....','...XX.XX','....XXXX','.....XX.'],
  check: ['.......X','......XX','.....XX.','X...XX..','XX.XX...','.XXX....','..X.....','........'],
  heart: ['.XX..XX.','XXXXXXXX','XXXXXXXX','XXXXXXXX','.XXXXXX.','..XXXX..','...XX...','........'],
  orb:   ['..XXXX..','.XXXXXX.','XXXXXXXX','XXXXXXXX','XXXXXXXX','XXXXXXXX','.XXXXXX.','..XXXX..'],
  logo:  ['..........','..........','...XXXX...','..X....X..','..X....X..','..X....X..','...XXXX.X.','..........','..........','..........'],
};
const COLORS = { cross: '#F0384F', clock: '#0AA3C2', phone: '#F0384F', check: '#12A866', heart: '#F0384F' };
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5; return s - Math.floor(s); };
function sprite(name, cell, color) {
  const rows = SPR[name], n = rows[0].length, sz = n * cell;
  let r = '';
  if (name === 'bars') return spriteBars(cell);
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== 'X') return;
    let fill = color || COLORS[name] || '#141416';
    if (name === 'orb') fill = ['#2F62F5', '#5B86FA', '#9DB8F8', '#2F62F5'][Math.floor(h2(x, y) * 4)];
    r += `<rect x="${x * cell + 1}" y="${y * cell + 1}" width="${cell - 2}" height="${cell - 2}" fill="${fill}"/>`;
  }));
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${r}</svg>`;
}
function spriteBars(cell) { // an accent, as a voice level
  const hs = [2, 5, 8, 4, 6, 3, 1], n = 8, sz = n * cell; let r = '';
  hs.forEach((h, x) => { for (let j = 0; j < h; j++) { const y = Math.round((n - h) / 2) + j;
    r += `<rect x="${x * cell + 1}" y="${y * cell + 1}" width="${cell - 2}" height="${cell - 2}" fill="#F58F0D"/>`; } });
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${r}</svg>`;
}
function eyesSvg(s) {
  const w = s * .3, h = s * .52;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><rect x="${s * .12}" y="${s * .22}" width="${w}" height="${h}" rx="${w * .3}" fill="#141416"/><rect x="${s * .58}" y="${s * .22}" width="${w}" height="${h}" rx="${w * .3}" fill="#141416"/></svg>`;
}

// ——— kinetic rows ———
function scene() { const s = document.createElement('div'); s.className = 'scene'; cam.appendChild(s); return s; }
function row(sc, y, size, tokens, extra = '') {
  const r = document.createElement('div'); r.className = 'row ' + extra; r.style.top = (y - size / 2) + 'px'; r.style.height = size + 'px'; r.style.fontSize = size + 'px';
  sc.appendChild(r);
  return tokens.map(tok => word(r, tok, size));
}
function word(r, tok, size) {
  const w = document.createElement('span'); w.className = 'w'; const inn = document.createElement('span'); inn.className = 'in'; w.appendChild(inn);
  if (tok[0] === '@') {
    const name = tok.slice(1), cell = Math.round(size * .105);
    const ic = document.createElement('span'); ic.className = 'ic';
    ic.innerHTML = name === 'eyes' ? eyesSvg(cell * 8) : name === 'bars' ? spriteBars(cell) : sprite(name, cell);
    inn.appendChild(ic); w._parts = [ic]; w._icon = true;
  } else {
    let cls = '';
    if (tok[0] === '*') { cls = 'px'; tok = tok.slice(1); }
    else if (tok[0] === '~') { cls = 'dim'; tok = tok.slice(1); }
    if (cls) inn.classList.add(cls);
    w._parts = [...tok].map(ch => { const l = document.createElement('span'); l.className = 'l'; l.textContent = ch === ' ' ? ' ' : ch; inn.appendChild(l); return l; });
  }
  r.appendChild(w); return w;
}
const measure = () => document.querySelectorAll('.w').forEach(w => w._w = w.firstChild.getBoundingClientRect().width / stageScale());
function stageScale() { const t = getComputedStyle(stage).transform; return t === 'none' ? 1 : new DOMMatrix(t).a; }

const tl = gsap.timeline({ paused: true });
function inW(w, t, d = .5) {
  tl.to(w, { width: () => w._w, duration: d, ease: 'power3.out' }, t);
  if (w._icon) tl.fromTo(w._parts, { opacity: 0, scale: 0, rotate: -20 }, { opacity: 1, scale: 1, rotate: 0, duration: .7, ease: 'back.out(2.6)' }, t + .05);
  else tl.fromTo(w._parts, { opacity: 0, y: 46, filter: 'blur(12px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .6, stagger: .028, ease: 'back.out(2.2)' }, t);
}
function outW(w, t, collapse = true) {
  tl.to(w._parts, { opacity: 0, y: -34, filter: 'blur(12px)', scale: w._icon ? .4 : 1, duration: .32, stagger: .01, ease: 'power2.in' }, t);
  if (collapse) tl.to(w, { width: 0, duration: .45, ease: 'power3.inOut' }, t + .12);
}
const seq = (ws, t, gap = .16) => { ws.forEach((w, i) => inW(w, t + i * gap)); return t + ws.length * gap; };
const outAll = (ws, t, collapse = false) => ws.forEach((w, i) => outW(w, t + i * .02, collapse));
const show = (sc, a, b) => { tl.set(sc, { visibility: 'visible' }, a); tl.set(sc, { visibility: 'hidden' }, b); };

function bubble(sc, text, { x, right, y, mine, words = false }) {
  const b = document.createElement('div'); b.className = 'bub' + (mine ? ' mine' : '');
  if (right != null) b.style.right = right + 'px'; else b.style.left = x + 'px';
  b.style.top = y + 'px';
  if (words) { b.innerHTML = text.split(' ').map(s => `<span class="sw" style="opacity:0;display:inline-block">${s}</span>`).join(' '); }
  else b.innerHTML = text;
  b.style.transformOrigin = right != null ? '100% 100%' : '0% 100%';
  sc.appendChild(b); return b;
}
const popB = (b, t) => tl.fromTo(b, { opacity: 0, scale: .82, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: .55, ease: 'back.out(1.8)' }, t);
function who(sc, text, { x, right, y }) { const d = document.createElement('div'); d.className = 'who'; d.textContent = text;
  if (right != null) d.style.right = right + 'px'; else d.style.left = x + 'px'; d.style.top = y + 'px'; sc.appendChild(d); return d; }

// ——— orb (the fluent self, drawn like the app's ring) ———
const O = { x: 540, y: 760, size: 0, speak: 0, alpha: 0 };
const nz = (x, y, t) => .5 + .5 * Math.sin(x * .9 + t * 1.4 + Math.sin(y * .7 + t)) * Math.cos(y * .8 - t * 1.1 + Math.sin(x * .5 + t * .4));
function drawOrb(t) {
  orbC.style.opacity = O.alpha; if (O.alpha <= 0 || O.size <= 2) return;
  const S = O.size; orbC.style.width = S + 'px'; orbC.style.height = S + 'px';
  orbC.style.left = (O.x - S / 2) + 'px'; orbC.style.top = (O.y - S / 2) + 'px';
  const c = octx, R = 330, cx = 360, cy = 360; c.clearRect(0, 0, 720, 720);
  c.save(); c.shadowColor = 'rgba(40,70,160,.18)'; c.shadowBlur = 40; c.shadowOffsetY = 12;
  c.fillStyle = '#FBFCFE'; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill(); c.restore();
  c.fillStyle = '#EFF2F8'; c.beginPath(); c.arc(cx, cy, R - 26, 0, 7); c.fill();
  const env = O.speak * (.35 + .65 * Math.abs(Math.sin(t * 5.1) * Math.sin(t * 2.3 + 1)));
  c.save(); c.beginPath(); c.arc(cx, cy, R - 30, 0, 7); c.clip();
  const step = 40;
  for (let gy = -8; gy <= 8; gy++) for (let gx = -8; gx <= 8; gx++) {
    const px = cx + gx * step, py = cy + gy * step, d = Math.hypot(px - cx, py - cy) / (R - 30);
    if (d > 1.02) continue;
    const n = nz(gx * .55, gy * .55, t * 1.3);
    const idle = n > .55 ? (n - .55) * 1.4 : 0;
    const k = Math.min(1, Math.pow(n, 1.5) * env * 1.5 * (1.1 - d * .5));
    const a = Math.max(idle * .5, k);
    if (a < .04) continue;
    const r = Math.round(220 - (220 - 47) * k), g = Math.round(228 - (228 - 98) * k), b = Math.round(245 - (245 - 245) * k);
    c.fillStyle = `rgba(${r},${g},${b},${Math.min(1, .35 + a)})`; c.fillRect(px - step / 2 + 3, py - step / 2 + 3, step - 6, step - 6);
  }
  c.restore();
  const sh = c.createRadialGradient(cx, cy, R - 120, cx, cy, R - 26); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(150,160,190,.22)');
  c.fillStyle = sh; c.beginPath(); c.arc(cx, cy, R - 26, 0, 7); c.fill();
}
