:root{
  --bg:#121110; --tx:#EDECE8; --dim:#9C9A94; --faint:#6E6C66;
  --sans:"Helvetica Neue",Helvetica,Arial,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --pixel:"Pixelify Sans","Helvetica Neue",Arial,sans-serif;
}
.flower-gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(72% 56% at 50% 50%, rgba(18,17,16,.74), rgba(18,17,16,.22) 64%, rgba(18,17,16,0) 100%);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; position:relative;
}
/* editorial layout — logo top-left · orb mid-left · brand bottom-left · form bottom-right */
.mark{ position:fixed; top:40px; left:40px; z-index:2; display:block; width:74px; color:var(--tx); }
.mark svg{ display:block; width:100%; height:auto; }
.lang{ position:fixed; top:40px; right:40px; z-index:3; display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; }
.lang .lopt{ background:transparent; border:0; padding:0; cursor:pointer; color:var(--faint); transition:color .15s; }
.lang .lopt:hover{ color:var(--dim); }
.lang .lopt.on{ color:var(--tx); }
.lang .sep{ color:var(--faint); }
.fself{ position:fixed; left:40px; top:47%; transform:translateY(-50%); z-index:2;
  display:block; width:132px; height:66px; border-radius:999px;
  transition:left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1), width .9s cubic-bezier(.4,0,.2,1), height .9s cubic-bezier(.4,0,.2,1), transform .9s cubic-bezier(.4,0,.2,1), border-radius .9s; }
/* Beta apply: the orb glides to center and becomes a play button */
.beta-play .fself{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:172px; height:172px; border-radius:50%; margin:0; z-index:4; }
.playbtn{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5;
  width:172px; height:172px; border-radius:50%; border:0; background:transparent; cursor:pointer;
  display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity .5s .5s; }
.beta-play .playbtn{ opacity:1; pointer-events:auto; }
.playbtn svg{ width:42px; height:42px; color:#F2F1ED; filter:drop-shadow(0 2px 10px rgba(0,0,0,.7)); transition:transform .15s; }
.playbtn:hover svg{ transform:scale(1.08); }
.playbtn .ico-pause{ display:none; }
.playbtn.playing .ico-play{ display:none; } .playbtn.playing .ico-pause{ display:block; }
/* synced captions under the play button (beta-play only) */
.caption{ position:fixed; left:50%; top:calc(50% + 118px); transform:translateX(-50%); z-index:5;
  width:min(620px,86vw); text-align:center; white-space:pre-line;
  font-size:clamp(15px,1.8vw,19px); line-height:1.5; color:var(--tx);
  opacity:0; pointer-events:none; transition:opacity .35s; text-shadow:0 1px 12px rgba(0,0,0,.7); }
.beta-play .caption{ opacity:1; }
@media (max-width:760px){ .caption{ top:calc(50% + 104px); font-size:15.5px; } }
.band{ position:fixed; left:40px; right:40px; bottom:40px; z-index:2;
  display:flex; align-items:flex-end; justify-content:space-between; gap:48px; }
/* status eyebrow above the wordmark */
.eyebrow{ display:flex; align-items:center; gap:9px; margin-bottom:16px; font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:#4064F5; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(64,100,245,.5)} 50%{box-shadow:0 0 0 6px rgba(64,100,245,0)} }
.brand-word{ font-family:var(--pixel); font-weight:400; font-size:clamp(30px,4.2vw,46px); line-height:1; letter-spacing:-0.01em; }
.tag{ margin-top:18px; font-size:clamp(15px,1.6vw,19px); line-height:1.4; color:var(--dim); letter-spacing:.01em; }
.mini{ margin-top:18px; font-family:var(--mono); font-size:11.5px; letter-spacing:.05em; color:var(--faint); }
.mini a{ color:var(--faint); text-decoration:none; } .mini a:hover{ color:var(--tx); }
.join{ width:min(468px,100%); display:flex; flex-direction:column; gap:16px; }
/* text-based tabs with a sliding underline indicator */
.seg{ display:flex; gap:24px; position:relative; }
.seg .opt{ background:transparent; border:0; padding:0 0 8px; cursor:pointer;
  font-family:var(--mono); font-size:13px; letter-spacing:.03em; color:var(--dim); transition:color .18s; }
.seg .opt:hover{ color:var(--tx); }
.seg .opt.on{ color:var(--tx); }
.seg-ind{ position:absolute; bottom:0; left:0; height:2px; width:0; background:var(--tx); pointer-events:none;
  transition:transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1); }
.joinrow{ display:flex; gap:10px; width:100%; }
.in{ flex:1; min-width:0; background:transparent; border:1px solid rgba(237,236,232,0.28);
  color:var(--tx); font-family:var(--sans); font-size:15px; padding:14px 16px; border-radius:0; outline:none; transition:border-color .15s; }
.in::placeholder{ color:var(--faint); }
.in:focus{ border-color:rgba(237,236,232,0.6); }
.btn{ flex:none; background:transparent; color:var(--tx); border:1px solid rgba(237,236,232,0.4); cursor:pointer;
  font-family:var(--mono); font-size:13px; letter-spacing:.08em; padding:0 22px; transition:background .15s, color .15s, border-color .15s; }
.btn:hover{ background:#F2F1ED; color:#131211; border-color:#F2F1ED; }
.btn:disabled{ opacity:.55; cursor:default; }
.msg{ min-height:16px; font-family:var(--mono); font-size:12px; letter-spacing:.03em; color:var(--dim); }
.msg.ok{ color:#86C9A4; } .msg.err{ color:#E39288; }
.join.done .seg, .join.done .joinrow{ display:none; }
@media (max-width:760px){
  .mark{ top:24px; left:24px; width:54px; }
  .fself{ left:24px; top:112px; transform:none; }   /* JS centers it between logo and band */
  /* "In beta testing" moves to the top-right, level with the logo */
  .eyebrow{ position:fixed; top:44px; right:24px; margin:0; z-index:2; }
  .lang{ top:70px; right:24px; }
  .band{ left:24px; right:24px; bottom:24px; flex-direction:column; align-items:flex-start; gap:22px; }
  .join{ width:100%; max-width:420px; gap:12px; }
  .join .msg{ min-height:0; }
}

    'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*n(p);p*=2.1;a*=.5;}return v;}' +

    'float form=.40+.60*ridge*mix(1.,.55,rr);' +

    'float rad=uSize.y*0.5;vec2 pc=position-uSize*0.5;vec2 ax=vec2(max(uSize.x*0.5-rad,0.0),0.0);'+

    'float topW=clamp(0.5-pc.y/uSize.y,0.0,1.0);float shade=rim*(0.14+0.34*topW);'+
    'col*=1.0-shade*(uDark==1.0?0.85:0.45);'+
    'col+=vec3(rim*(1.0-topW)*(uDark==1.0?0.06:0.05));'+
    'float tq=mod(floor(uTime*18.0),64.0);float g=hash21(position*1.7+tq*vec2(13.7,91.3))-0.5;'+
    'col+=vec3(g*(uDark==1.0?0.06:0.04));'+
    'gl_FragColor=vec4(col,1.0);}';
  var VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

  window.mountFutureself=function(canvas, theme, dark){
    if(!canvas) return;
    theme=theme||0; dark=dark?1:0;
    var gl=canvas.getContext('webgl',{antialias:false,alpha:false});
    if(!gl) return;
    function sh(ty,src){var x=gl.createShader(ty);gl.shaderSource(x,src);gl.compileShader(x);return x;}
    var pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(pr);gl.useProgram(pr);
    var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
    var pal=PAL[theme][dark?0:1];
    var flat=new Float32Array(15);for(var i=0;i<5;i++){flat[i*3]=pal[i][0];flat[i*3+1]=pal[i][1];flat[i*3+2]=pal[i][2];}
    gl.uniform3fv(gl.getUniformLocation(pr,'uPal[0]'),flat);
    gl.uniform3f(gl.getUniformLocation(pr,'uBase'),pal[0][0],pal[0][1],pal[0][2]);
    var uSize=gl.getUniformLocation(pr,'uSize'),uTime=gl.getUniformLocation(pr,'uTime'),
        uLevel=gl.getUniformLocation(pr,'uLevel'),uMode=gl.getUniformLocation(pr,'uMode'),uDark=gl.getUniformLocation(pr,'uDark');
    gl.uniform1f(uDark,dark);
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var sm={v:0,last:0,step:function(target,time){var dt=this.last===0?1/60:Math.min(0.1,Math.max(0,time-this.last));this.last=time;var tau=target>this.v?0.06:0.35;this.v+=(target-this.v)*(1-Math.exp(-dt/tau));return this.v;}};
    var t0=0,mode=3,nextMode=0;
    (function frame(ms){
      ms=ms||0; if(!t0)t0=ms; var t=(ms-t0)/1000;
      var dpr=Math.min(window.devicePixelRatio||1,2);
      var w=Math.max(2,canvas.clientWidth*dpr)|0,h=Math.max(2,canvas.clientHeight*dpr)|0;
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
      var ext=window.__fselfAudioLevel, curMode, target;
      if(ext!=null){ curMode=3; target=ext; }                      // driven by the beta audio (speaking)
      else {
        if(ms>nextMode){ mode=(mode===3?1:3); nextMode=ms+(4200+Math.random()*3000); }
        curMode=mode;
        target=0.30+0.26*Math.sin(t*0.9)+0.22*Math.max(0,Math.sin(t*3.3))*Math.max(0,Math.sin(t*1.7+0.5)); // synthesized "voice"
      }
      target=Math.min(1,Math.max(0,target));
      gl.uniform2f(uSize,w,h);
      gl.uniform1f(uTime, reduce?6.0:t);
      gl.uniform1f(uLevel, reduce?0.5:sm.step(target,ms/1000));
      gl.uniform1f(uMode, reduce?3.0:curMode);
      gl.drawArrays(gl.TRIANGLES,0,3);
      if(!reduce) requestAnimationFrame(frame);
    })(0);
  };
  mountFutureself(document.getElementById('fself'), 0, 1);   // blue theme, dark surface
})();
</script>

<script>
// ── Beta play: orb → center play button, drives Futureself from the audio ──
(function(){
  var audio=document.getElementById('baudio'), pb=document.getElementById('playbtn');
  var orb=document.getElementById('fself');
  var actx, analyser, srcNode, data, pumping=false;
  // captions: load the WebVTT matching the current audio language, sync by time
  var cap=document.getElementById('caption'), cues=[], capSrc=null;
  function tc(x){ x=x.trim().split(' ')[0]; var q=x.split(':'), n=0;
    if(q.length===3) n=(+q[0])*3600+(+q[1])*60+parseFloat(q[1+1]);
    else if(q.length===2) n=(+q[0])*60+parseFloat(q[1]); else n=parseFloat(q[0]||0);
    return n||0; }
  function parseVTT(txt){ var out=[], blk=txt.replace(/\r/g,'').split(/\n\n+/);
    for(var i=0;i<blk.length;i++){ var ls=blk[i].split('\n'), ti=-1;
      for(var j=0;j<ls.length;j++){ if(ls[j].indexOf('-->')>-1){ ti=j; break; } }
      if(ti<0) continue; var mm=ls[ti].split('-->');
      var tx=ls.slice(ti+1).join('\n').trim(); if(tx) out.push({s:tc(mm[0]),e:tc(mm[1]),t:tx}); }
    return out; }
  function loadCaptions(){
    var src=audio.getAttribute('src')||''; var vtt=/beta-en/.test(src)?'/beta-en.vtt':'/beta-ko.vtt';
    if(vtt===capSrc) return; capSrc=vtt; cues=[]; if(cap) cap.textContent='';
    fetch(vtt).then(function(r){ return r.ok?r.text():''; })
      .then(function(x){ cues=x?parseVTT(x):[]; }).catch(function(){ cues=[]; });
  }
  // On mobile, center the orb vertically between the logo and the bottom band.
  // On desktop, clear inline styles so the CSS (mid-left) takes over.
  function centerOrb(){
    if(!orb || document.body.classList.contains('beta-play')) return;
    var prev=orb.style.transition; orb.style.transition='none';
    if(window.matchMedia('(max-width:760px)').matches){
      var mark=document.querySelector('.mark'), band=document.querySelector('.band');
      if(mark&&band){
        var mb=mark.getBoundingClientRect().bottom, bt=band.getBoundingClientRect().top;
        orb.style.left='24px'; orb.style.transform='none';
        orb.style.top=Math.max(mb+8, (mb+bt)/2 - orb.offsetHeight/2)+'px';
      }
    } else { orb.style.top=''; orb.style.left=''; orb.style.transform=''; }
    void orb.offsetWidth; orb.style.transition=prev;
  }
  window.addEventListener('load', centerOrb);
  window.addEventListener('resize', centerOrb);
  centerOrb();
  window.startBetaPlay=function(){
    if(orb){ orb.style.top=''; orb.style.left=''; orb.style.transform=''; }  // let the CSS glide it to center
    document.body.classList.add('beta-play'); if(pb) pb.hidden=false;
  };
  if(!pb||!audio) return;
  function initAudio(){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      srcNode=actx.createMediaElementSource(audio);
      analyser=actx.createAnalyser(); analyser.fftSize=256;
      srcNode.connect(analyser); analyser.connect(actx.destination);
      data=new Uint8Array(analyser.fftSize);
    }catch(e){ analyser=null; }
  }
  function pump(){
    if(audio.paused){ pumping=false; window.__fselfAudioLevel=null; return; }
    if(analyser){
      analyser.getByteTimeDomainData(data);
      var sum=0; for(var i=0;i<data.length;i++){ var v=(data[i]-128)/128; sum+=v*v; }
      window.__fselfAudioLevel=Math.min(1, Math.sqrt(sum/data.length)*3.4);
    } else { window.__fselfAudioLevel=0.6; }
    requestAnimationFrame(pump);
  }
  pb.addEventListener('click', function(){
    if(!actx) initAudio();
    if(actx && actx.state==='suspended') actx.resume();
    if(audio.paused){ audio.play().catch(function(){}); } else { audio.pause(); }
  });
  audio.addEventListener('play', function(){ pb.classList.add('playing'); if(!pumping){ pumping=true; pump(); } });
  audio.addEventListener('pause', function(){ pb.classList.remove('playing'); window.__fselfAudioLevel=null; });
  audio.addEventListener('ended', function(){ pb.classList.remove('playing'); window.__fselfAudioLevel=null; });
})();
</script>
