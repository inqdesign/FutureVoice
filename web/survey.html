<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>nawana</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* One page for every survey: questions come from /survey/<id>.json.
   Big tap targets, submit pinned to the bottom, answers editable after sending. */
:root{
  --bg:#FCFBF8; --card:#ffffff; --ink:#141310; --dim:#57544D; --faint:#918E85; --line:#E6E3DA;
  --accent:#0A5CF5; --accent-ink:#ffffff; --sel:#E8F0FE; --err:#C0392B;
  --font:-apple-system,"Apple SD Gothic Neo","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121210; --card:#1C1C19; --ink:#F2F0EA; --dim:#B5B1A7; --faint:#86837B; --line:#2E2D29;
  --accent:#5B8CFF; --accent-ink:#0B0B0A; --sel:#1B2A4A; --err:#FF7A6B; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--ink);text-decoration:none;font-weight:700}
.brand img{width:30px;height:30px;border-radius:8px;display:block}
h1{font-size:26px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
.intro{color:var(--dim);margin:0 0 26px}
.q{margin:0 0 30px}
.q h2{font-size:18px;margin:0 0 4px;line-height:1.4}
.q .hint{font-size:14px;color:var(--faint);margin:0 0 10px}
.q .err{display:none;font-size:14px;color:var(--err);margin:6px 0 0}
.q.missing .err{display:block}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;text-align:left;
  font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.opt[aria-pressed="true"] .mark{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt.multi[aria-pressed="true"] .mark::after{width:10px;height:6px;border-radius:0;background:none;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.opt:focus-visible,textarea:focus-visible,.send:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:96px;margin-top:10px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .in{max-width:560px;margin:0 auto}
.send{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.send[disabled]{opacity:.6}
.status{font-size:14px;color:var(--err);text-align:center;margin:8px 0 0;min-height:1em}
.done{text-align:center;padding-top:12vh}
.done h1{font-size:28px}
.done p{color:var(--dim)}
.link{display:inline-block;margin-top:18px;color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:8px}
.missing-page{color:var(--dim);text-align:center;padding-top:20vh}
@media (prefers-reduced-motion: reduce){.opt{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="bar" id="bar" hidden><div class="in"><button class="send" id="send" type="button"></button><p class="status" id="status"></p></div></div>
<script>
const SUPABASE_URL = "https://chhzjtigzdotacutwcyo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoaHpqdGlnemRvdGFjdXR3Y3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTk3NDUsImV4cCI6MjA5NjU3NTc0NX0.tcGaH-m2jJklxsQ8YaHU1UaxtJAZkoRBq0B--inPHVU";
const APP_URL = "https://apps.apple.com/app/id6792794655";

const params = new URLSearchParams(location.search);
// nawana.app/s/<survey>?t=<token>; ?s=<survey> for a local preview.
const surveyId = (location.pathname.match(/^\/s\/([a-z0-9-]+)/) || [])[1] || params.get("s") || "";
const token = params.get("t") || null;
const app = document.getElementById("app"), bar = document.getElementById("bar");
const sendBtn = document.getElementById("send"), statusEl = document.getElementById("status");

const rpc = (fn, body) => fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
  method: "POST",
  headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`, "Content-Type": "application/json" },
  body: JSON.stringify(body),
}).then(async (r) => { if (!r.ok) throw new Error(await r.text()); return r.json(); });

const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
};

let survey, lang, T, answers = {};

function pickLang(langs) {
  const want = params.get("l") || (navigator.language || "ko").slice(0, 2);
  return langs.includes(want) ? want : (langs.includes("en") && want !== "ko" ? "en" : langs[0]);
}

function renderForm() {
  app.replaceChildren();
  app.append(
    el("a", { class: "brand", href: "https://nawana.app" }, [el("img", { src: "/mail/nawana-icon-256.png", alt: "" }), "nawana"]),
    el("h1", { text: T.title }),
    el("p", { class: "intro", text: T.intro }),
  );
  for (const q of survey.questions) {
    const box = el("section", { class: "q", id: `q-${q.id}` });
    box.append(el("h2", { text: q[lang] + (q.required ? "" : ` (${T.optional})`) }));
    if (q.type === "multi") box.append(el("p", { class: "hint", text: T.multi_hint }));
    if (q.type === "text") {
      const ta = el("textarea", { id: `in-${q.id}`, maxlength: "2000", placeholder: q[`placeholder_${lang}`] || "", "aria-label": q[lang] });
      ta.value = answers[q.id] || "";
      ta.addEventListener("input", () => { answers[q.id] = ta.value; });
      box.append(ta);
    } else {
      const opts = el("div", { class: "opts", role: q.type === "multi" ? "group" : "radiogroup", "aria-label": q[lang] });
      for (const o of q.options) {
        const on = q.type === "multi" ? (answers[q.id] || []).includes(o.v) : answers[q.id] === o.v;
        const b = el("button", { type: "button", class: "opt" + (q.type === "multi" ? " multi" : ""), "aria-pressed": String(on), id: `o-${q.id}-${o.v}` },
          [el("span", { class: "mark", "aria-hidden": "true" }), el("span", { text: o[lang] })]);
        b.addEventListener("click", () => choose(q, o));
        opts.append(b);
      }
      box.append(opts);
    }
    box.append(el("p", { class: "err", text: T.required }));
    app.append(box);
  }
  sendBtn.textContent = T.submit;
  bar.hidden = false;
}

function choose(q, o) {
  if (q.type === "multi") {
    let cur = answers[q.id] || [];
    if (cur.includes(o.v)) cur = cur.filter((v) => v !== o.v);
    else if (o.exclusive) cur = [o.v];
    else cur = cur.filter((v) => !q.options.find((x) => x.v === v)?.exclusive).concat(o.v);
    answers[q.id] = cur;
  } else {
    answers[q.id] = o.v;
  }
  document.getElementById(`q-${q.id}`).classList.remove("missing");
  for (const x of q.options) {
    const on = q.type === "multi" ? (answers[q.id] || []).includes(x.v) : answers[q.id] === x.v;
    document.getElementById(`o-${q.id}-${x.v}`).setAttribute("aria-pressed", String(on));
  }
}

async function submit() {
  statusEl.textContent = "";
  let first = null;
  for (const q of survey.questions) {
    const a = answers[q.id];
    const empty = a == null || (Array.isArray(a) ? a.length === 0 : String(a).trim() === "");
    document.getElementById(`q-${q.id}`).classList.toggle("missing", q.required && empty);
    if (q.required && empty && !first) first = q;
  }
  if (first) { document.getElementById(`q-${first.id}`).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  sendBtn.disabled = true; sendBtn.textContent = T.sending;
  try {
    await rpc("survey_submit", { p_survey: survey.id, p_token: token, p_answers: answers, p_lang: lang });
    renderDone();
  } catch {
    statusEl.textContent = T.error;
  } finally {
    sendBtn.disabled = false; sendBtn.textContent = T.submit;
  }
}

function renderDone() {
  bar.hidden = true;
  app.replaceChildren(el("div", { class: "done" }, [
    el("h1", { text: T.thanks_title }),
    el("p", { text: T.thanks_body }),
    token ? el("button", { class: "link", type: "button", text: T.edit, onclick: () => { renderForm(); scrollTo(0, 0); } }) : null,
    el("div", {}, el("a", { class: "link", href: APP_URL, text: T.back_to_app })),
  ]));
  scrollTo(0, 0);
}

sendBtn.addEventListener("click", submit);

(async () => {
  try {
    if (!surveyId) throw new Error("no survey");
    const r = await fetch(`/survey/${surveyId}.json`, { cache: "no-cache" });
    if (!r.ok) throw new Error("not found");
    survey = await r.json();
    lang = pickLang(survey.langs); T = survey.page[lang];
    document.documentElement.lang = lang; document.title = T.title;
    if (token) {
      const o = await rpc("survey_open", { p_survey: survey.id, p_token: token }).catch(() => null);
      if (o?.answers) { answers = o.answers; renderForm(); renderDone(); return; }
    }
    renderForm();
  } catch {
    app.replaceChildren(el("p", { class: "missing-page", text: "This survey isn't available." }));
  }
})();
</script>
</body>
</html>
