<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>nawana — waitlist</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
:root{
  --bg:#121110; --tx:#EDECE8; --dim:#9C9A94; --faint:#6E6C66; --line:rgba(237,236,232,.12);
  --sans:"Helvetica Neue",Helvetica,Arial,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;padding:24px;}
.card{width:min(720px,100%);}
.head{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:34px;}
.head .dot{width:7px;height:7px;border-radius:50%;background:#3ECf8E;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:34px 26px;}
.cell .n{font-family:var(--mono);font-size:clamp(40px,7vw,72px);font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
.cell .l{margin-top:16px;font-size:14px;color:var(--dim);letter-spacing:.02em;}
.foot{margin-top:26px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--faint);}
.foot a{color:var(--dim);text-decoration:none;} .foot a:hover{color:var(--tx);}
.err{color:#E39288;}
@media(max-width:560px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
  <div class="card">
    <div class="head"><span class="dot"></span>nawana · waitlist</div>
    <div class="grid">
      <div class="cell"><div class="n" id="total">—</div><div class="l">Total signups</div></div>
      <div class="cell"><div class="n" id="beta">—</div><div class="l">Beta testers</div></div>
      <div class="cell"><div class="n" id="today">—</div><div class="l">Joined today (UTC)</div></div>
    </div>
    <div class="foot">
      <span id="status">Loading…</span>
      <a href="/">← nawana.app</a>
    </div>
  </div>
<script>
(function(){
  var SUPA='https://chhzjtigzdotacutwcyo.supabase.co';
  var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoaHpqdGlnemRvdGFjdXR3Y3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTk3NDUsImV4cCI6MjA5NjU3NTc0NX0.tcGaH-m2jJklxsQ8YaHU1UaxtJAZkoRBq0B--inPHVU';
  var $=function(id){return document.getElementById(id);};
  function pad(n){return String(n).padStart(2,'0');}
  async function load(){
    try{
      var r=await fetch(SUPA+'/rest/v1/rpc/waitlist_stats',{
        method:'POST', headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'}, body:'{}'
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      var d=await r.json();
      $('total').textContent=d.total; $('beta').textContent=d.beta; $('today').textContent=d.today;
      var t=new Date();
      $('status').textContent='Updated '+pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds());
      $('status').className='';
    }catch(e){
      $('status').textContent='Could not load — is the waitlist_stats() function created?';
      $('status').className='err';
    }
  }
  load(); setInterval(load, 30000);
})();
</script>
</body>
</html>
